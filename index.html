/* Lien : l'équivalent d'une connexion, au-dessus des messages du courtier. */
class Lien {
  constructor(envoi, fermer) { this.h = {}; this.open = true; this._envoi = envoi; this._fermer = fermer; }
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); return this; }
  emit(e, ...a) { (this.h[e] || []).slice().forEach((f) => f(...a)); }
  send(m) { if (this.open) this._envoi(m); }
  couper() { this.open = false; try { if (this._fermer) this._fermer(); } catch (e) { /* déjà fermé */ } }
  close() {
    if (!this.open) return;
    this.open = false;
    try { if (this._fermer) this._fermer(); } catch (e) { /* déjà fermé */ }
    this.emit("close");
  }
}
const idAleatoire = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
/* Identité stable de ce navigateur : permet de reprendre sa place après avoir quitté une partie. */
let jetonMemoire = null;
function jetonJoueur() {
  try {
    let t = localStorage.getItem("belote-jeton");
    if (!t) { t = idAleatoire() + idAleatoire(); localStorage.setItem("belote-jeton", t); }
    return t;
  } catch (e) {
    if (!jetonMemoire) jetonMemoire = idAleatoire() + idAleatoire();
    return jetonMemoire;
  }
}
const analyser = (payload) => { try { return JSON.parse(payload.toString()); } catch (e) { return null; } };

function connecterMqtt(url, opts) {
  return new Promise((res, rej) => {
    let client = null, fini = false;
    const t = setTimeout(() => { if (!fini) { fini = true; try { client.end(true); } catch (e) { /* rien */ } rej(new Error("délai")); } }, R.T.connexion);
    try { client = R.connecter(url, Object.assign({ reconnectPeriod: 2000, connectTimeout: R.T.connexion, keepalive: 30, clean: true }, opts)); }
    catch (e) { clearTimeout(t); return rej(e); }
    client.on("error", () => { /* géré par le délai ou la reconnexion */ });
    client.once("connect", () => { if (!fini) { fini = true; clearTimeout(t); res(client); } });
  });
}
/* Premier serveur de messages qui répond, parmi tous (ils sont publics : certains sont lents ou saturés). */
function connecterPremier(opts) {
  return new Promise((res) => {
    let fini = false, echecs = 0;
    BROKERS.forEach((url) => {
      connecterMqtt(url, opts)
        .then((client) => { if (fini) { try { client.end(true); } catch (e) { /* rien */ } } else { fini = true; res(client); } })
        .catch(() => { echecs++; if (echecs === BROKERS.length && !fini) { fini = true; res(null); } });
    });
  });
}

/* Lien au-dessus d'une connexion directe (PeerJS). */
function lienDirect(conn) {
  const lien = new Lien((m) => conn.send(m), () => { try { conn.close(); } catch (e) { /* déjà fermé */ } });
  conn.on("data", (m) => lien.emit("data", m));
  conn.on("close", () => lien.close());
  conn.on("error", () => lien.close());
  return lien;
}

/* Une salle est joignable par deux voies indépendantes : connexion directe (PeerJS) et serveur de messages
   (MQTT). Elle s'ouvre dès que l'une des deux répond ; les joueurs utilisent celle qui marche pour eux. */
async function ouvrirSalle(pseudo, tentative = 0) {
  if (typeof mqtt === "undefined" && typeof Peer === "undefined") return messageReseau("net_indispo", true);
  if (tentative === 0) quitterReseau();
  const jeton = ++R.essai;
  messageReseau("net_creation");
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const code = Array.from({ length: 5 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  const rubrique = PREFIXE + code + "/", id = idAleatoire();
  let pret = false, echecs = 0;
  const voies = (typeof Peer !== "undefined" ? 1 : 0) + (typeof mqtt !== "undefined" ? 1 : 0);
  const prete = () => { if (!pret && jeton === R.essai) { pret = true; initHote(code, id, pseudo, rubrique); } };
  const echec = () => {
    echecs++;
    if (echecs >= voies && !pret && jeton === R.essai) messageReseau("net_sature", true);
  };
  // a) connexion directe : l'identifiant réseau de l'hôte est le code de la salle
  if (typeof Peer !== "undefined") {
    try {
      const peer = R.usinePeer("belote-" + code);
      R.peerMedia = peer;
      accepterAppelsMedia(peer);
      peer.on("connection", (conn) => conn.on("open", () => { if (R.role === "hote") accepter(lienDirect(conn)); }));
      peer.on("open", (pid) => { prete(); if (R.role === "hote") declarerPeerId(pid); });
      peer.on("error", (e) => {
        if (jeton !== R.essai || pret) return;
        if (e.type === "unavailable-id" && tentative < 4) { try { peer.destroy(); } catch (x) { /* rien */ } R.peerMedia = null; ouvrirSalle(pseudo, tentative + 1); return; }
        echec();
      });
    } catch (e) { echec(); }
  }
  // b) serveur de messages
  if (typeof mqtt !== "undefined") {
    const client = await connecterPremier({ clientId: "belote-h-" + id, will: { topic: rubrique + "presence", payload: "", retain: true, qos: 0 } });
    if (jeton !== R.essai) { if (client) try { client.end(true); } catch (e) { /* rien */ } return; }
    if (client) { prete(); attacherMqttHote(client, rubrique); } else echec();
  }
}

function initHote(code, id, pseudo, rubrique) {
  R.role = "hote"; R.phase = "salle"; R.code = code; R.rubrique = rubrique; R.monId = id;
  R.places = [{ nom: propre(pseudo), lien: null, peerId: (R.peerMedia && R.peerMedia.id) || null }, null, null, null];
  R.clients = new Map();
  S.moi = 0;
  R.minuteries.push(setInterval(() => {
    if (R.mqtt) {
      try { R.mqtt.publish(R.rubrique + "tous", JSON.stringify({ t: "ping" })); } catch (e) { /* hors ligne */ }
      if (R.publierPresence) R.publierPresence();
    }
    diffuser({ t: "ping" }); // aussi vers les joueurs en connexion directe
    for (const c of [...R.clients.values()]) if (Date.now() - c.vu > R.T.perteClient) c.lien.close();
  }, R.T.ping));
  messageReseau("");
  afficherSalle();
}

function attacherMqttHote(client, rubrique) {
  R.mqtt = client;
  R.publierPresence = () => { try { client.publish(rubrique + "presence", JSON.stringify({ t: "salle", ts: Date.now() }), { retain: true }); } catch (e) { /* hors ligne */ } };
  client.subscribe([rubrique + "hote", rubrique + "m/+/a", rubrique + "m/+/v"]);
  R.publierPresence();
  client.on("message", (topic, payload) => {
    if (topic.startsWith(rubrique + "m/")) { recevoirRelais(topic, payload); return; }
    if (topic !== rubrique + "hote") return;
    const m = analyser(payload);
    if (!m || typeof m.de !== "string" || m.de.length > 40) return;
    let c = R.clients.get(m.de);
    if (m.t === "bye") { if (c) c.lien.close(); return; }
    if (!c) {
      if (m.t !== "hello") return;
      const lien = new Lien((msg) => client.publish(rubrique + "c/" + m.de, JSON.stringify(msg)), () => R.clients.delete(m.de));
      c = { lien, vu: Date.now() };
      R.clients.set(m.de, c);
      accepter(lien);
    }
    c.vu = Date.now();
    if (m.t !== "ping") c.lien.emit("data", m);
  });
}

/* Voix et vidéo : identifiant WebRTC de ce navigateur, annoncé aux autres joueurs. */
function creerPeerMedia() {
  if (typeof Peer === "undefined") return;
  try {
    const peer = R.usinePeer();
    R.peerMedia = peer;
    accepterAppelsMedia(peer);
    peer.on("open", (id) => declarerPeerId(id));
    peer.on("error", () => { /* voix et vidéo indisponibles, le jeu continue */ });
  } catch (e) { /* voix et vidéo indisponibles */ }
}
function declarerPeerId(id) {
  if (R.role === "hote") {
    if (R.places[S.moi]) R.places[S.moi].peerId = id;
    if (R.phase === "salle") diffuserSalle();
    synchroniserMedia();
  } else if (R.role === "client" && R.lienHote) {
    R.lienHote.send({ t: "peer", peerId: id });
  }
}

function accepter(conn) {
  conn.on("data", (msg) => {
    if (!msg || typeof msg !== "object") return;
    if (msg.t === "hello") {
      const nom = propre(msg.nom);
      const jeton = typeof msg.jeton === "string" ? msg.jeton.slice(0, 40) : null;
      const peerId = typeof msg.peerId === "string" ? msg.peerId.slice(0, 64) : null;
      if (R.phase === "jeu") {
        // un joueur parti peut reprendre sa place : même navigateur (jeton) ou même pseudo
        const libres = [0, 1, 2, 3].filter((i) => R.absents[i] && S.sieges[i] === "bot");
        let q = libres.find((i) => jeton && R.absents[i].jeton === jeton);
        if (q === undefined) q = libres.find((i) => R.absents[i].nom.toLowerCase() === nom.toLowerCase());
        if (q === undefined) { conn.send({ t: "refus", code: "encours" }); setTimeout(() => conn.close(), 200); return; }
        reprendrePlace(conn, q, nom, jeton, peerId);
        return;
      }
      if (R.phase !== "salle") { conn.send({ t: "refus", code: "indispo" }); setTimeout(() => conn.close(), 200); return; }
      const q = ORDRE_PLACES.find((i) => !R.places[i]);
      if (q === undefined) { conn.send({ t: "refus", code: "pleine" }); setTimeout(() => conn.close(), 200); return; }
      conn._siege = q;
      R.places[q] = { nom, lien: conn, peerId, jeton };
      diffuserSalle(); afficherSalle(); synchroniserMedia();
      return;
    }
    const q = conn._siege;
    if (q === undefined || !R.places[q] || R.places[q].lien !== conn) return;
    if (msg.t === "siege" && Number.isInteger(msg.q) && msg.q >= 0 && msg.q < 4) deplacer(q, msg.q);
    else if (msg.t === "quitte") joueurParti(conn, true);
    else if (msg.t === "peer" && typeof msg.peerId === "string") {
      R.places[q].peerId = msg.peerId.slice(0, 64);
      if (R.phase === "salle") diffuserSalle(); // en partie, les identifiants partent avec l'état de jeu
      synchroniserMedia();
    } else if (msg.t === "reponse") {
      const a = R.attentes.get(msg.id);
      if (a && a.p === q) { R.attentes.delete(msg.id); a.res(valider(a.kind, a.d, msg.valeur)); }
    } else if (msg.t === "pret") {
      const r = R.fiches.get(`${msg.id}:${q}`);
      if (r) { R.fiches.delete(`${msg.id}:${q}`); r(); }
    }
  });
  conn.on("close", () => joueurParti(conn));
}

/* Un joueur parti revient : il reprend sa main et sa place, le bot s'efface. */
function reprendrePlace(conn, q, nom, jeton, peerId) {
  conn._siege = q;
  R.places[q] = { nom, lien: conn, peerId, jeton };
  delete R.absents[q];
  S.sieges[q] = "distant"; R.nomsAbs[q] = nom; S.noms[q] = q === S.moi ? null : nom;
  conn.send({ t: "debut" });
  synchroniserMedia();
  afficherAvis("avis_revenu", nom);
}

function joueurParti(conn, volontaire) {
  const q = conn._siege;
  if (q === undefined || !R.places[q] || R.places[q].lien !== conn) return;
  const nomParti = R.places[q].nom;
  const jetonParti = R.places[q].jeton || null;
  R.places[q] = null;
  if (R.phase === "salle") { diffuserSalle(); afficherSalle(); synchroniserMedia(); return; }
  // En pleine partie : un bot prend la place et décide à sa place.
  S.sieges[q] = "bot"; R.nomsAbs[q] = null; S.noms[q] = null;
  R.absents[q] = { nom: nomParti, jeton: jetonParti };
  synchroniserMedia();
  afficherAvis(volontaire ? "avis_quitte" : "avis_deconnecte", nomParti);
  for (const [id, a] of [...R.attentes]) {
    if (a.p === q) { R.attentes.delete(id); a.res(reponseBot(q, a.kind, a.d)); }
  }
  for (const [cle, res] of [...R.fiches]) {
    if (cle.endsWith(":" + q)) { R.fiches.delete(cle); res(); }
  }
  render();
}

function lancerEnLigne() {
  if (R.role !== "hote" || nbHumains() < 2) return;
  S.accueilActif = false;
  R.phase = "jeu";
  S.sieges = R.places.map((p, q) => (!p ? "bot" : p.lien ? "distant" : "local"));
  R.nomsAbs = R.places.map((p) => (p ? p.nom : null));
  S.noms = R.nomsAbs.map((n, q) => (q === S.moi ? null : n));
  diffuser({ t: "debut" });
  cacherFiche();
  jouerPartie();
}
function retourSalle() {
  S.partieId++; R.phase = "salle"; R.absents = {};
  S.sieges = ["local", "bot", "bot", "bot"];
  diffuserSalle(); afficherSalle();
}

/* ---- Voix et vidéo entre joueurs (WebRTC, un appel par joueur et par type de flux) ---- */
/* Chaque joueur publie son micro et sa caméra séparément : il appelle les autres joueurs humains avec le flux.
   Les destinataires répondent sans rien envoyer en retour. Rien ne transite par un serveur de jeu. */
const M = {
  flux: { audio: null, video: null },   // mes flux publiés
  appels: new Map(),                    // "kind:peerId" -> appel sortant
  recus: new Map(),                     // "kind:peerId" -> { appel, flux }
  lecteurs: new Map(),                  // peerId -> <audio>
  analyses: new WeakMap(), ctx: null, message: null,
  signature: "",
};
const peersActuels = () => (R.role === "hote" ? R.places.map((p) => (p && p.peerId) || null) : R.peersVus || [null, null, null, null]);
const monPeerId = () => (R.peerMedia && R.peerMedia.id) || null;

function accepterAppelsMedia(peer) {
  peer.on("call", (appel) => {
    const peers = peersActuels();
    if (R.role === "solo" || !peers.includes(appel.peer) || appel.peer === monPeerId()) { try { appel.close(); } catch (e) { /* déjà fermé */ } return; }
    const kind = appel.metadata && appel.metadata.kind === "video" ? "video" : "audio";
    const cle = kind + ":" + appel.peer;
    try { appel.answer(); } catch (e) { return; }
    appel.on("stream", (flux) => { M.recus.set(cle, { appel, flux }); majVisio(); });
    appel.on("close", () => { if (M.recus.get(cle) && M.recus.get(cle).appel === appel) M.recus.delete(cle); majVisio(); });
    appel.on("error", () => { M.recus.delete(cle); majVisio(); });
  });
}

function synchroniserMedia() {
  const voulus = new Set();
  if (R.peerMedia && R.role !== "solo") {
    peersActuels().forEach((id) => {
      if (!id || id === monPeerId()) return;
      for (const kind of ["audio", "video"]) {
        if (!M.flux[kind]) continue;
        const cle = kind + ":" + id;
        voulus.add(cle);
        if (M.appels.has(cle)) continue;
        try {
          const appel = R.peerMedia.call(id, M.flux[kind], { metadata: { kind } });
          M.appels.set(cle, appel);
          RELAIS.debutAppel.set(cle, Date.now());
          const fin = () => { if (M.appels.get(cle) === appel) M.appels.delete(cle); };
          appel.on("close", fin); appel.on("error", fin);
        } catch (e) { /* appel impossible pour l'instant */ }
      }
    });
  }
  for (const [cle, appel] of [...M.appels]) {
    if (!voulus.has(cle)) { try { appel.close(); } catch (e) { /* déjà fermé */ } M.appels.delete(cle); }
  }
  // flux reçus d'un joueur qui n'est plus là
  const presents = new Set(peersActuels().filter(Boolean));
  for (const [cle, r] of [...M.recus]) {
    if (!presents.has(cle.slice(cle.indexOf(":") + 1))) { try { r.appel.close(); } catch (e) { /* déjà fermé */ } M.recus.delete(cle); }
  }
  majVisio();
}

function messageMedia(k) {
  M.message = k || null;
  const el = document.querySelector("#msg-media");
  if (el) el.textContent = k ? t(k) : "";
}
async function basculerMedia(kind) {
  contexteAudio();
  if (M.flux[kind]) { arreterFlux(kind); synchroniserMedia(); majBoutonsMedia(); majRelais(); return; }
  const md = typeof navigator !== "undefined" && navigator.mediaDevices;
  if (!md || !md.getUserMedia) { messageMedia("med_indispo"); return; }
  try {
    M.flux[kind] = await md.getUserMedia(kind === "audio"
      ? { audio: { echoCancellation: true, noiseSuppression: true }, video: false }
      : { video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: "user" }, audio: false });
    messageMedia("");
  } catch (e) {
    messageMedia(kind === "audio" ? "med_refus_audio" : "med_refus_video");
  }
  synchroniserMedia(); majBoutonsMedia(); majRelais();
}
function arreterFlux(kind) {
  for (const cle of [...RELAIS.debutAppel.keys()]) if (cle.startsWith(kind + ":")) RELAIS.debutAppel.delete(cle);
  const f = M.flux[kind];
  if (f) try { f.getTracks().forEach((t) => t.stop()); } catch (e) { /* flux déjà arrêté */ }
  M.flux[kind] = null;
}
function arreterMedia() {
  arreterFlux("audio"); arreterFlux("video");
  arreterRelaisAudio(); arreterRelaisVideo(); RELAIS.actif = false;
  for (const appel of M.appels.values()) try { appel.close(); } catch (e) { /* déjà fermé */ }
  for (const r of M.recus.values()) try { r.appel.close(); } catch (e) { /* déjà fermé */ }
  M.appels.clear(); M.recus.clear();
  majVisio(); majBoutonsMedia();
}

const TETE_SVG = '<svg class="visage" viewBox="0 0 64 64" role="img" aria-label="" fill="currentColor"><circle cx="32" cy="22" r="12"/><path d="M8 60c0-13 10-22 24-22s24 9 24 22z"/></svg>';
const MICRO_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg>';
const CAMERA_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10a2 2 0 0 1 2 2v1.5l4-2.5v10l-4-2.5V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>';

/* Places occupées par des humains, vues de ce navigateur. */
function siegesHumains() {
  if (R.role === "solo") return [];
  const hum = [];
  for (let q = 0; q < 4; q++) {
    let h;
    if (R.phase === "salle") h = R.role === "hote" ? !!R.places[q] : !!R.placesVues[q];
    else h = q === S.moi || (R.role === "hote" ? S.sieges[q] === "distant" : !!S.noms[q]);
    if (h) hum.push(q);
  }
  return hum;
}
function nomVisio(q) {
  if (q === S.moi) return "Vous";
  if (R.role === "hote") return (R.places[q] && R.places[q].nom) || "Joueur";
  return S.noms[q] || (R.placesVues[q] && R.placesVues[q].nom) || "Joueur";
}

/* Niveau sonore d'un flux : sert à entourer la vignette de celui qui parle. */
function contexteAudio() {
  if (!M.ctx) { try { M.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { M.ctx = null; } }
  if (M.ctx && M.ctx.state === "suspended") M.ctx.resume().catch(() => {});
  return M.ctx;
}
function niveauDe(flux) {
  if (!flux || !flux.getAudioTracks || !flux.getAudioTracks().length) return 0;
  let a = M.analyses.get(flux);
  if (a === undefined) {
    a = null;
    const ctx = contexteAudio();
    if (ctx) {
      try {
        const src = ctx.createMediaStreamSource(flux), an = ctx.createAnalyser();
        an.fftSize = 256; src.connect(an);
        a = { an, buf: new Uint8Array(an.fftSize) };
      } catch (e) { a = null; }
    }
    M.analyses.set(flux, a);
  }
  if (!a) return 0;
  a.an.getByteTimeDomainData(a.buf);
  let s = 0;
  for (const v of a.buf) { const x = (v - 128) / 128; s += x * x; }
  return Math.sqrt(s / a.buf.length);
}
function majParole() {
  document.querySelectorAll(".tuile").forEach((t) => {
    const q = Number(t.dataset.q);
    const flux = q === S.moi ? M.flux.audio : (M.recus.get("audio:" + (peersActuels()[q] || "")) || {}).flux;
    const direct = niveauDe(flux) > 0.035;
    const secours = q !== S.moi && relaisAudioFrais(q) && RELAIS.niveaux.get(q) > 0.035;
    t.classList.toggle("parle", direct || secours);
  });
}

function lireSons() {
  let bloque = false;
  for (const l of M.lecteurs.values()) {
    const p = l.play();
    if (p && p.catch) p.catch(() => { bloque = true; const b = document.querySelector("#btn-son"); if (b) b.hidden = false; });
  }
  if (!bloque) { const b = document.querySelector("#btn-son"); if (b) b.hidden = true; }
}

/* Met à jour les vignettes, une par joueur humain, à côté de son nom sur la table. */
function majVisio() {
  const panneau = document.querySelector("#visio");
  if (panneau) panneau.hidden = R.role === "solo";
  const humains = siegesHumains();
  // vignettes obsolètes
  document.querySelectorAll(".tuile").forEach((tu) => { if (!humains.includes(Number(tu.dataset.q))) tu.remove(); });
  const peers = peersActuels();
  const lecteursVus = new Set();
  for (const q of humains) {
    const id = peers[q] || null;
    const soi = q === S.moi;
    const conteneur = document.querySelector(`#siege-${rel(q)} .siege-visio`);
    if (!conteneur) continue;
    let tu = document.querySelector(`.tuile[data-q="${q}"]`);
    if (!tu) {
      tu = document.createElement("div");
      tu.className = "tuile"; tu.dataset.q = String(q);
      tu.innerHTML = `${TETE_SVG}<video playsinline autoplay muted hidden></video><img class="relais" alt="" hidden><span class="son" hidden></span><span class="etiquette"></span>` +
        (soi ? `<span class="boutons"><button type="button" class="bouton-media" data-media="audio" aria-pressed="false" aria-label="${t("micro")}">${MICRO_SVG}</button><button type="button" class="bouton-media" data-media="video" aria-pressed="false" aria-label="${t("camera")}">${CAMERA_SVG}</button></span>` : "");
    }
    if (tu.parentNode !== conteneur) conteneur.appendChild(tu);
    tu.dataset.q = String(q);
    const flux = soi ? M.flux.video : id && (M.recus.get("video:" + id) || {}).flux;
    const video = tu.querySelector("video");
    if (video.srcObject !== (flux || null)) {
      video.srcObject = flux || null;
      if (flux) { const p = video.play(); if (p && p.catch) p.catch(() => {}); }
    }
    video.classList.toggle("miroir", soi);
    video.hidden = !flux;
    // mode de secours : image reçue par le serveur de messages quand la connexion directe ne passe pas
    const rv = !soi && !flux ? RELAIS.images.get(q) : null;
    const imageFraiche = !!rv && Date.now() - rv.ts < 4000;
    const img = tu.querySelector("img.relais");
    if (imageFraiche) { if (img.dataset.url !== rv.url) { img.src = rv.url; img.dataset.url = rv.url; } img.hidden = false; }
    else { img.hidden = true; }
    tu.querySelector(".visage").style.display = flux || imageFraiche ? "none" : "";
    const relaisSon = !soi && !(id && M.recus.has("audio:" + id)) && relaisAudioFrais(q);
    const audioActif = soi ? !!M.flux.audio : !!(id && M.recus.has("audio:" + id)) || relaisSon;
    tu.querySelector(".son").hidden = !audioActif;
    const videoVisible = soi ? !!M.flux.video : (!!flux || imageFraiche);
    tu.classList.toggle("masquer", videoVisible && audioActif);
    tu.querySelector(".etiquette").textContent = nomVisio(q);
    tu.title = nomVisio(q);
    tu.setAttribute("aria-label", t("vignette_de", nomVisio(q)));
    // lecteur audio (autres joueurs) : rattaché au document, pas masqué par display:none
    if (!soi && id) {
      const r = M.recus.get("audio:" + id);
      let l = M.lecteurs.get(id);
      if (r && !l) {
        l = document.createElement("audio");
        l.autoplay = true; l.setAttribute("playsinline", "");
        l.style.cssText = "position:absolute;width:0;height:0;opacity:0;pointer-events:none";
        document.body.appendChild(l); M.lecteurs.set(id, l);
      }
      if (l && r && l.srcObject !== r.flux) { l.srcObject = r.flux; const p = l.play(); if (p && p.catch) p.catch(() => { const b = document.querySelector("#btn-son"); if (b) b.hidden = false; }); }
      if (l) lecteursVus.add(id);
    }
  }
  for (const [id, l] of [...M.lecteurs]) {
    const r = M.recus.get("audio:" + id);
    if (!r || !lecteursVus.has(id)) { l.srcObject = null; l.remove(); M.lecteurs.delete(id); }
  }
  majBoutonsMedia();
}

function majBoutonsMedia() {
  document.querySelectorAll("[data-media]").forEach((b) => {
    const actif = !!M.flux[b.dataset.media];
    b.setAttribute("aria-pressed", String(actif));
    const nomBtn = b.dataset.media === "audio" ? t("micro") : t("camera");
    if (b.classList.contains("bouton-media")) b.setAttribute("aria-label", actif ? t("media_on", nomBtn) : t("media_off", nomBtn));
    else b.textContent = nomBtn + (actif ? " · " + t("active") : "");
  });
  const mm = document.querySelector("#msg-media");
  if (mm && M.message) mm.textContent = t(M.message);
  document.querySelectorAll(".tuile").forEach((tu) => {
    const q = Number(tu.dataset.q);
    tu.title = nomVisio(q);
    tu.setAttribute("aria-label", t("vignette_de", nomVisio(q)));
    const v = tu.querySelector(".visage"); if (v) v.setAttribute("aria-label", t("cam_eteinte"));
  });
}

/* ---- Mode de secours : voix et vidéo allégées via le serveur de messages ---- */
/* Quand la connexion directe ne s'établit pas (4G, pare-feu), le son (8 kHz, µ-law) et une image
   réduite toutes les 0,4 s transitent par le même serveur de messages que le jeu. Qualité téléphone. */
const RELAIS = {
  actif: false, proc: null, src: null, sourceCtx: null, tampon: [], videoEl: null, canvas: null, minuterieVideo: null,
  prochain: new Map(),      // siège -> prochain instant de lecture
  niveaux: new Map(),       // siège -> niveau sonore du dernier paquet
  vusAudio: new Map(),      // siège -> date du dernier paquet audio
  images: new Map(),        // siège -> { url, ts }
  debutAppel: new Map(),    // "kind:peerId" -> date de création de l'appel
};
const FREQ_RELAIS = 8000, PAQUET_RELAIS = 1600; // 200 ms

function muLawEncode(s) {
  const BIAS = 0x84, CLIP = 32635;
  const signe = (s >> 8) & 0x80;
  if (signe) s = -s;
  if (s > CLIP) s = CLIP;
  s += BIAS;
  let exposant = 7;
  for (let masque = 0x4000; (s & masque) === 0 && exposant > 0; masque >>= 1) exposant--;
  const mantisse = (s >> (exposant + 3)) & 0x0f;
  return ~(signe | (exposant << 4) | mantisse) & 0xff;
}
function muLawDecode(u) {
  u = ~u & 0xff;
  const signe = u & 0x80, exposant = (u >> 4) & 7, mantisse = u & 15;
  let s = (((mantisse << 3) + 0x84) << exposant) - 0x84;
  return signe ? -s : s;
}
const relaisAudioFrais = (q) => Date.now() - (RELAIS.vusAudio.get(q) || 0) < 1500;

function publierRelais(sorte, octets) {
  if (!R.mqtt || R.role === "solo" || !R.rubrique) return;
  try { R.mqtt.publish(R.rubrique + "m/" + S.moi + "/" + sorte, octets); } catch (e) { /* hors ligne */ }
}

/* Vrai si au moins un joueur ne reçoit pas notre flux par la connexion directe. */
function relaisNecessaire() {
  if (R.role === "solo" || !(M.flux.audio || M.flux.video)) return false;
  const autres = siegesHumains().filter((q) => q !== S.moi);
  if (!autres.length) return false;
  const peers = peersActuels();
  const maintenant = Date.now();
  for (const q of autres) {
    const id = peers[q];
    for (const kind of ["audio", "video"]) {
      if (!M.flux[kind]) continue;
      if (!id) return true;
      const cle = kind + ":" + id;
      const appel = M.appels.get(cle);
      const etat = appel && appel.peerConnection && appel.peerConnection.iceConnectionState;
      if (etat === "connected" || etat === "completed") { RELAIS.debutAppel.delete(cle); continue; }
      // pas d'appel établi : la connexion directe a 5 secondes pour aboutir, sinon on passe en secours
      let debut = RELAIS.debutAppel.get(cle);
      if (!debut) { debut = maintenant; RELAIS.debutAppel.set(cle, debut); }
      if (maintenant - debut > 5000) return true;
    }
  }
  return false;
}

function demarrerRelaisAudio() {
  if (RELAIS.proc || !M.flux.audio) return;
  const ctx = contexteAudio();
  if (!ctx || !ctx.createScriptProcessor) return;
  try {
    RELAIS.src = ctx.createMediaStreamSource(M.flux.audio);
    RELAIS.proc = ctx.createScriptProcessor(2048, 1, 1);
    const ratio = ctx.sampleRate / FREQ_RELAIS;
    let reste = 0, somme = 0, n = 0, calme = 0;
    RELAIS.proc.onaudioprocess = (e) => {
      const entree = e.inputBuffer.getChannelData(0);
      for (let i = 0; i < entree.length; i++) {
        somme += entree[i]; n++; reste++;
        if (reste >= ratio) { RELAIS.tampon.push(somme / n); somme = 0; n = 0; reste -= ratio; }
      }
      while (RELAIS.tampon.length >= PAQUET_RELAIS) {
        const bloc = RELAIS.tampon.splice(0, PAQUET_RELAIS);
        let energie = 0;
        for (const v of bloc) energie += v * v;
        const niveau = Math.sqrt(energie / bloc.length);
        if (niveau > 0.008) calme = 0; else calme++;
        if (calme > 3) continue; // silence prolongé : on n'envoie rien
        const octets = new Uint8Array(bloc.length);
        for (let i = 0; i < bloc.length; i++) octets[i] = muLawEncode(Math.max(-1, Math.min(1, bloc[i])) * 32767);
        publierRelais("a", octets);
      }
    };
    RELAIS.src.connect(RELAIS.proc);
    RELAIS.proc.connect(ctx.destination);
  } catch (e) { arreterRelaisAudio(); }
}
function arreterRelaisAudio() {
  try { if (RELAIS.proc) { RELAIS.proc.onaudioprocess = null; RELAIS.proc.disconnect(); } } catch (e) { /* rien */ }
  try { if (RELAIS.src) RELAIS.src.disconnect(); } catch (e) { /* rien */ }
  RELAIS.proc = null; RELAIS.src = null; RELAIS.tampon = [];
}
function demarrerRelaisVideo() {
  if (RELAIS.minuterieVideo || !M.flux.video) return;
  try {
    RELAIS.videoEl = document.createElement("video");
    RELAIS.videoEl.muted = true; RELAIS.videoEl.setAttribute("playsinline", ""); RELAIS.videoEl.srcObject = M.flux.video;
    const p = RELAIS.videoEl.play(); if (p && p.catch) p.catch(() => {});
    RELAIS.canvas = document.createElement("canvas");
    RELAIS.canvas.width = 160; RELAIS.canvas.height = 120;
    const g = RELAIS.canvas.getContext("2d");
    RELAIS.minuterieVideo = setInterval(() => {
      if (!M.flux.video || RELAIS.videoEl.readyState < 2) return;
      try {
        g.drawImage(RELAIS.videoEl, 0, 0, 160, 120);

}

/* Réception d'un paquet de secours : topic = <rubrique>m/<siège>/<a|v>. */
function recevoirRelais(topic, payload) {
  const m = /\/m\/(\d)\/([av])$/.exec(topic);
  if (!m) return;
  const q = Number(m[1]);
  if (q === S.moi || R.role === "solo") return;
  const id = peersActuels()[q];
  if (m[2] === "a") {
    if (id && M.recus.has("audio:" + id)) return;          // la connexion directe est là : on l'utilise
    const octets = payload instanceof Uint8Array ? payload : new Uint8Array(payload);
    const ctx = contexteAudio();
    if (!ctx || !octets.length) return;
    const flottants = new Float32Array(octets.length);
    let energie = 0;
    for (let i = 0; i < octets.length; i++) { const v = muLawDecode(octets[i]) / 32768; flottants[i] = v; energie += v * v; }
    RELAIS.niveaux.set(q, Math.sqrt(energie / octets.length));
    RELAIS.vusAudio.set(q, Date.now());
    try {
      const buf = ctx.createBuffer(1, flottants.length, FREQ_RELAIS);
      buf.getChannelData(0).set(flottants);
      const source = ctx.createBufferSource();
      source.buffer = buf; source.connect(ctx.destination);
      let t = Math.max(ctx.currentTime + 0.3, RELAIS.prochain.get(q) || 0);
      if (t - ctx.currentTime > 1.5) t = ctx.currentTime + 0.3;
      source.start(t);
      RELAIS.prochain.set(q, t + flottants.length / FREQ_RELAIS);
    } catch (e) { /* lecture impossible */ }
  } else {
    if (id && M.recus.has("video:" + id)) return;
    try {
      const url = URL.createObjectURL(new Blob([payload], { type: "image/jpeg" }));
      const ancien = RELAIS.images.get(q);
      RELAIS.images.set(q, { url, ts: Date.now() });
      if (ancien) setTimeout(() => URL.revokeObjectURL(ancien.url), 1000);
    } catch (e) { /* image illisible */ }
  }
  // les vignettes ne sont redessinées qu'avec la table : on les rafraîchit ici, au plus 3 fois par seconde
  const maintenant = Date.now();
  if (maintenant - (RELAIS.derniereMaj || 0) > 350) { RELAIS.derniereMaj = maintenant; majVisio(); }
}

/* ---- Client ---- */
async function rejoindre(code, pseudo) {
  if (typeof mqtt === "undefined" && typeof Peer === "undefined") return messageReseau("net_indispo", true);
  code = String(code || "").trim().toUpperCase();
  if (!/^[A-Z2-9]{5}$/.test(code)) return messageReseau("net_code5", true);
  quitterReseau();
  const jeton = ++R.essai;
  messageReseau("net_connexion");
  const id = idAleatoire(), rubrique = PREFIXE + code + "/";
  const ouverts = [];
  let gagnant = null, peer = null, peerIntrouvable = false, finir;
  const fin = new Promise((r) => { finir = r; });
  const delai = setTimeout(() => finir(), R.T.connexion + 6000);
  const gagne = (g) => { if (gagnant) return; gagnant = g; clearTimeout(delai); finir(); };
  // a) connexion directe vers l'hôte
  if (typeof Peer !== "undefined") {
    try {
      peer = R.usinePeer(null);
      accepterAppelsMedia(peer);
      peer.on("open", () => {
        const conn = peer.connect("belote-" + code, { reliable: true, serialization: "json" });
        conn.on("open", () => gagne({ type: "direct", conn }));
      });
      peer.on("error", (e) => { if (e.type === "peer-unavailable") peerIntrouvable = true; });
    } catch (e) { peer = null; }
  }
  // b) serveur de messages : on interroge tous les serveurs, la salle est sur celui de l'hôte
  if (typeof mqtt !== "undefined") {
    let echecs = 0;
    BROKERS.forEach((url) => {
      connecterMqtt(url, { clientId: "belote-c-" + id + "-" + Math.random().toString(36).slice(2, 6),
        will: { topic: rubrique + "hote", payload: JSON.stringify({ t: "bye", de: id }), qos: 0 } })
        .then((client) => {
          ouverts.push(client);
          if (gagnant) return;
          client.on("message", (topic, payload) => {
            if (gagnant || topic !== rubrique + "presence") return;
            const m = analyser(payload);
            if (m && m.t === "salle" && Math.abs(Date.now() - m.ts) < R.T.presence) gagne({ type: "mqtt", client });
          });
          client.subscribe(rubrique + "presence");
        })
        .catch(() => { echecs++; });
    });
  }
  await fin;
  clearTimeout(delai);
  const fermerMqtt = (sauf) => ouverts.forEach((c) => { if (!sauf || c !== sauf.client) try { c.end(true); } catch (e) { /* rien */ } });
  if (jeton !== R.essai) { fermerMqtt(null); if (peer) try { peer.destroy(); } catch (e) { /* rien */ } return; }
  if (!gagnant) {
    fermerMqtt(null);
    if (peer) try { peer.destroy(); } catch (e) { /* rien */ }
    return messageReseau(ouverts.length || peerIntrouvable ? "net_introuvable" : "net_injoignable", true);
  }
  R.role = "client"; R.code = code; R.rubrique = rubrique; R.monId = id; R.dernierVu = Date.now(); R.peerMedia = peer;
  let lien;
  if (gagnant.type === "direct") {
    fermerMqtt(null);
    lien = lienDirect(gagnant.conn);
    lien.on("data", (m) => { R.dernierVu = Date.now(); if (m && m.t !== "ping") traiterMessageClient(m); });
    lien.on("close", () => { if (R.role === "client") { quitterReseau(); menu(); messageReseau("net_perdue", true); } });
  } else {
    fermerMqtt(gagnant);
    const client = gagnant.client;
    R.mqtt = client;
    client.subscribe([rubrique + "c/" + id, rubrique + "tous", rubrique + "m/+/a", rubrique + "m/+/v"]);
    client.on("message", (topic, payload) => {
      if (topic.startsWith(rubrique + "m/")) { recevoirRelais(topic, payload); return; }
      if (topic !== rubrique + "c/" + id && topic !== rubrique + "tous") return;
      const m = analyser(payload);
      if (!m) return;
      R.dernierVu = Date.now();
      if (m.t !== "ping") traiterMessageClient(m);
    });
    lien = new Lien((msg) => client.publish(rubrique + "hote", JSON.stringify(Object.assign({ de: id }, msg))), null);
  }
  R.lienHote = lien;
  if (!peer) creerPeerMedia();
  lien.send({ t: "hello", nom: propre(pseudo), jeton: jetonJoueur(), peerId: (R.peerMedia && R.peerMedia.id) || null });
  try { localStorage.setItem("belote-derniere-salle", JSON.stringify({ code, pseudo: propre(pseudo), ts: Date.now() })); } catch (e) { /* stockage indisponible */ }
  if (R.peerMedia && R.peerMedia.id) declarerPeerId(R.peerMedia.id);
  else if (R.peerMedia) R.peerMedia.on("open", (pid) => declarerPeerId(pid));
  R.minuteries.push(setInterval(() => {
    lien.send({ t: "ping" });
    if (Date.now() - R.dernierVu > R.T.perteHote) { quitterReseau(); menu(); messageReseau("net_perdue", true); }
  }, R.T.ping));
  R.minuteries.push(setTimeout(() => {
    if (R.role === "client" && R.phase === null) { quitterReseau(); messageReseau("net_noresp", true); }
  }, 12000));
}

function traiterMessageClient(msg) {
  if (!msg || typeof msg !== "object") return;
  switch (msg.t) {
    case "salle":
      R.phase = "salle"; R.placesVues = msg.places; R.code = msg.code; S.moi = msg.moi;
      R.peersVus = msg.peers || [null, null, null, null];
      afficherSalle(); synchroniserMedia();
      break;
    case "debut":
      R.phase = "jeu"; S.partieId++; S.journal = []; S.attenteCarte = null; S.accueilActif = false; cacherFiche();
      break;
    case "etat": appliquerEtat(msg); break;
    case "demande": traiterDemande(msg); break;
    case "fiche": traiterFiche(msg); break;
    case "voix": parlerLocal(msg.p, msg.type, msg.args || []); break;
    case "refus": quitterReseau(); menu(); messageReseau("refus_" + (msg.code || "indispo"), true); break;
    case "ferme": {
      const par = typeof msg.nom === "string" && msg.nom ? msg.nom : t("hote_defaut");
      quitterReseau(); menu();
      messageReseau("net_ferme", true, par);
      break;
    }
  }
}
function appliquerEtat(m) {
  S.moi = m.L; S.mode = m.mode; S.cible = m.cible; S.scores = m.scores; S.donneur = m.donneur;
  S.atout = m.atout; S.preneur = m.preneur; S.contrat = m.contrat; S.mult = m.mult; S.retournee = m.retournee;
  S.tour = m.tour; S.gagnant = m.gagnant; S.pli = m.pli; S.bulles = m.bulles; S.journal = m.journal;
  S.enchereCourante = m.enchereCourante; S.toast = m.toast; S.noms = m.noms; S.plisGagnes = m.plisGagnes || [0, 0, 0, 0];
  if (m.avis) { if (!S.avis || JSON.stringify([S.avis.k, S.avis.a]) !== JSON.stringify([m.avis.k, m.avis.a])) S.avis = { k: m.avis.k, a: m.avis.a, jusqua: Date.now() + 7000 }; } else S.avis = null;
  S.sieges = [0, 1, 2, 3].map((q) => (q === m.L ? "local" : "distant"));
  S.mains = m.mains.map((x) => (Array.isArray(x) ? x : new Array(x).fill(null)));
  const signature = JSON.stringify(m.peers || []);
  if (signature !== M.signature) { M.signature = signature; R.peersVus = m.peers || [null, null, null, null]; synchroniserMedia(); }
  render(); renderJournal();
}
async function traiterDemande(msg) {
  const rep = await reponseLocale(msg.kind, msg.data);
  try { R.lienHote.send({ t: "reponse", id: msg.id, valeur: rep === undefined ? null : rep }); } catch (e) { /* hors ligne */ }
}
async function traiterFiche(msg) {
  const html = msg.kind === "bilan" ? ficheBilan(msg.data.r, msg.data.fin) : ficheFin(msg.data.scores);
  await attendreFiche(html, "suite");
  try { R.lienHote.send({ t: "pret", id: msg.id }); } catch (e) { /* hors ligne */ }
}

function quitterReseau() {
  const nomHote = R.role === "hote" && R.places[S.moi] ? R.places[S.moi].nom : "L'hôte";
  if (R.role === "hote") diffuser({ t: "ferme", nom: nomHote }); // liens directs : message explicite avant la coupure
  R.essai++;
  arreterMedia();
  R.minuteries.forEach((t) => { clearInterval(t); clearTimeout(t); });
  R.minuteries = [];
  try {
    const c = R.mqtt;
    if (c) {
      if (R.role === "hote") {
        c.publish(R.rubrique + "tous", JSON.stringify({ t: "ferme", nom: nomHote }));
        c.publish(R.rubrique + "presence", "", { retain: true });
      } else if (R.role === "client" && R.lienHote) {
        R.lienHote.send({ t: "bye" });
      }
      setTimeout(() => { try { c.end(true); } catch (e) { /* déjà fermé */ } }, 300);
    }
  } catch (e) { /* réseau déjà coupé */ }
  if (R.peerMedia) try { R.peerMedia.destroy(); } catch (e) { /* déjà détruit */ }
  for (const c of R.clients.values()) c.lien.open = false;
  // les connexions directes sont coupées un instant plus tard : le message d'adieu a le temps de partir
  const liensDirects = R.places.filter((p) => p && p.lien).map((p) => p.lien).concat(R.lienHote ? [R.lienHote] : []);
  setTimeout(() => liensDirects.forEach((l) => l.couper()), 300);
  R.clients = new Map();
  R.role = "solo"; R.phase = null; R.mqtt = null; R.rubrique = null; R.peerMedia = null; R.lienHote = null; R.code = null;
  R.places = [null, null, null, null]; R.placesVues = [null, null, null, null]; R.absents = {};
  R.attentes.clear(); R.fiches.clear(); R.peersVus = [null, null, null, null]; M.signature = "";
  S.moi = 0; S.sieges = ["local", "bot", "bot", "bot"]; S.noms = [null, null, null, null];
  S.avis = null;
  majBoutonQuitter();
}

/* Simulation sans interface, pour vérifier le moteur depuis la console. */
window.__belote = {
  async simuler(n, mode, niveau = "expert") {
    const avant = { mode: S.mode, auto: S.auto };
    S.auto = true; S.mode = mode; S.partieId++;
    const stats = { donnes: 0, redistribuees: 0, ecartTotal: 0, remplis: 0 };
    const Cls = { expert: BotExpert, malin: BotMalin, simple: Bot }[niveau];
    bots = [new Cls(), new Cls(), new Cls(), new Cls()];
    for (let i = 0; i < n; i++) {
      const r = await jouerDonne(i % 4);
      stats.donnes++;
      if (!r) { stats.redistribuees++; continue; }
      if (r.cartes[0] + r.cartes[1] !== TOTAL) stats.ecartTotal++;
      if (r.rempli) stats.remplis++;
    }
    S.auto = avant.auto; S.mode = avant.mode;
    return stats;
  },
};
