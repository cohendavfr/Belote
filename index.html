<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Mise en page : une table de jeu (haut = Partenaire, côtés = Ouest/Est), votre main en bas, journal à côté. */
:root {
  --bg: #eef1ee;
  --fg: #17201b;
  --muted: #5a6961;
  --panel: #ffffff;
  --line: #cdd7d1;
  --feutre: #1d5b45;
  --feutre-2: #154634;
  --carte: #fbfaf4;
  --encre: #1a1d1b;
  --rouge: #c23a2b;
  --or: #dba93f;
  --or-fg: #2b1e00;
  --ok: #1f7a4d;
  --ko: #b3261e;
  --font-titre: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-texte: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1310; --fg: #e5ece7; --muted: #93a39a; --panel: #16211b; --line: #2a382f;
    --ok: #55c58a; --ko: #f08a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1310; --fg: #e5ece7; --muted: #93a39a; --panel: #16211b; --line: #2a382f;
  --ok: #55c58a; --ko: #f08a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-texte); }
button { font: inherit; color: inherit; }
#app { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 28px; display: grid; gap: 12px; }

.barre { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.barre h1 { font: 700 26px/1 var(--font-titre); margin: 0; letter-spacing: -0.01em; }
.scores { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; font-variant-numeric: tabular-nums; }
.scores b { font: 700 22px/1 var(--font-titre); }
.scores span { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--or); }
.btn:focus-visible, .carte:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
.btn.or { background: var(--or); color: var(--or-fg); border-color: var(--or); }
.btn.or:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.actions-tete { display: flex; flex-wrap: wrap; gap: 8px; }
.table { position: relative; }
.table.avec-accueil { min-height: 560px; }
.accueil { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 12px; border-radius: inherit; background: #0000004d; }
.accueil[hidden] { display: none; }
.carte-accueil { width: min(380px, 100%); display: grid; gap: 10px; padding: 18px; border-radius: 16px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 10px 30px #0006; }
.carte-accueil h2 { font: 700 26px/1 var(--font-titre); margin: 0; }
.entete-accueil { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.langues { display: flex; gap: 4px; }
.langue { font: inherit; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.langue[aria-pressed="true"] { background: var(--or); border-color: var(--or); color: var(--or-fg); }
.langue:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
.carte-accueil .segment { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.carte-accueil .segment legend { grid-column: 1 / -1; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0; margin-bottom: 4px; }
.option { position: relative; display: block; }
.option input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.option span { display: block; text-align: center; padding: 9px 8px; border: 1px solid var(--line); border-radius: 10px; font-weight: 600; background: var(--bg); }
.option input:checked + span { background: var(--or); border-color: var(--or); color: var(--or-fg); }
.option input:focus-visible + span { outline: 3px solid var(--or); outline-offset: 2px; }
#bloc-ligne, #bloc-bots { display: grid; gap: 10px; }
#bloc-ligne[hidden], #bloc-bots[hidden] { display: none; }
.carte-accueil .separateur { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.carte-accueil .separateur::before, .carte-accueil .separateur::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.carte-accueil .resume { margin: 0; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.lien { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; }
.lien:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; border-radius: 4px; }
.btn.danger { border-color: var(--ko); color: var(--ko); }
.btn.danger:hover { border-color: var(--ko); background: var(--bg); }
.info.avis { justify-self: center; background: #8a2c24; color: #fff; border-radius: 999px; padding: 5px 14px; font-weight: 600; }
.btn .rouge { color: var(--rouge); }

.jeu { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 880px) { .jeu { grid-template-columns: minmax(0, 1fr) 230px; align-items: start; } }

.table {
  --cw: 50px; --cwm: 66px;
  background: radial-gradient(120% 90% at 50% 40%, var(--feutre) 0%, var(--feutre-2) 100%);
  border-radius: 22px; padding: 14px; color: #f2f6f3;
  display: grid; gap: 10px;
  grid-template-columns: minmax(64px, 1fr) minmax(0, 3.2fr) minmax(64px, 1fr);
  grid-template-areas: "contrat haut ." "gauche centre droite" "moi moi moi" "bas bas bas";
}
@media (max-width: 560px) {
  .table { --cw: 40px; --cwm: 52px; padding: 10px; gap: 6px; grid-template-columns: 58px minmax(0, 1fr) 58px; }
}
.siege { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; min-width: 0; }
.contrat { grid-area: contrat; align-self: start; justify-self: start; background: #0000004a; border-radius: 12px; padding: 8px 10px; display: grid; gap: 2px; font-size: 13px; line-height: 1.25; min-width: 0; max-width: 100%; }
.contrat:empty { display: none; }
.contrat .titre { font: 700 16px/1.1 var(--font-titre); }
.contrat .rouge { color: #ff9d8e; }
.contrat .note { color: #ffd98a; font-weight: 600; }
.contrat .mini { --cw: 36px; display: block; }
.s2 { grid-area: haut; flex-direction: row; justify-content: center; }
.s1 { grid-area: gauche; justify-content: center; }
.s3 { grid-area: droite; justify-content: center; }
.s0 { grid-area: moi; flex-direction: row; justify-content: center; }
.plaque { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; background: #0000004a; border-radius: 14px; padding: 3px 10px; font-weight: 600; font-size: 13px; }
.plaque.actif { box-shadow: 0 0 0 2px var(--or); background: #0000007a; }
.donneur { background: var(--or); color: var(--or-fg); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.bulle { background: var(--carte); color: var(--encre); border-radius: 10px; padding: 2px 8px; font-size: 12px; font-weight: 600; min-height: 22px; text-align: center; }
.bulle:empty { visibility: hidden; }
.bulle .rouge { color: var(--rouge); }

.carte { display: block; position: relative; flex: none; width: var(--cw); aspect-ratio: 5 / 7; border-radius: 8px; padding: 0; background: var(--carte); color: var(--encre); border: 1px solid #0003; box-shadow: 0 1px 3px #0005; font-family: var(--font-titre); font-weight: 700; cursor: default; }
.carte.rouge { color: var(--rouge); }
.carte .coin { position: absolute; top: 4px; left: 5px; display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: calc(var(--cw) * 0.34); }
.carte .coin i { font-style: normal; font-size: 0.9em; }
.carte .gros { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 28%; font-size: calc(var(--cw) * 0.56); opacity: 0.9; }
.carte.dos { background: repeating-linear-gradient(45deg, var(--feutre-2) 0 6px, #2d7a5c 6px 12px); border: 3px solid var(--carte); }
.carte.dos .nb { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; text-shadow: 0 1px 3px #000a; }
.carte.jouable { cursor: pointer; transition: transform 0.12s; }
.carte.jouable:hover, .carte.jouable:focus-visible { transform: translateY(-10px); }
.carte.grise { opacity: 0.5; }

.centre { grid-area: centre; display: grid; gap: 8px; justify-items: center; align-content: start; min-width: 0; }
.info { min-height: 24px; text-align: center; font-weight: 600; color: #ffd98a; }
.pli { display: grid; gap: 6px; grid-template-columns: repeat(3, var(--cw)); grid-template-rows: repeat(3, calc(var(--cw) * 1.4)); grid-template-areas: ". p2 ." "p1 . p3" ". p0 ."; place-items: center; }
.pli .p0 { grid-area: p0; } .pli .p1 { grid-area: p1; } .pli .p2 { grid-area: p2; } .pli .p3 { grid-area: p3; }
.pli .gagnant .carte { box-shadow: 0 0 0 3px var(--or), 0 1px 3px #0005; }
.pli .carte { animation: pose 0.18s ease-out; }
@keyframes pose { from { transform: scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pli .carte { animation: none; } .carte.jouable { transition: none; } }
.action { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 40px; align-items: center; }
.action .question { flex-basis: 100%; text-align: center; font-weight: 600; }
.valeurs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; flex-basis: 100%; }
.chip { border: 1px solid #ffffff55; background: #0000003a; color: #fff; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--or); color: var(--or-fg); border-color: var(--or); }
.chip:disabled { opacity: 0.35; cursor: not-allowed; }
.table .btn { color: var(--fg); }

.main { grid-area: bas; display: flex; justify-content: center; padding-top: 6px; --cw: var(--cwm); min-height: calc(var(--cwm) * 1.4 + 14px); }
.main .carte + .carte { margin-left: -14px; }
@media (max-width: 560px) { .main .carte + .carte { margin-left: -22px; } }

.cote { display: grid; gap: 12px; }
.panneau { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.panneau h2 { font: 700 15px/1.2 var(--font-titre); margin: 0 0 8px; }
.journal { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.journal li { color: var(--muted); }
.journal li:first-child { color: var(--fg); font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; }
details p, .regles p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

.voile { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; padding: 16px; z-index: 10; overflow: auto; }
.voile[hidden] { display: none; }
.fiche { background: var(--panel); color: var(--fg); border-radius: 18px; padding: 20px; width: min(460px, 100%); display: grid; gap: 14px; border: 1px solid var(--line); }
.fiche h2 { font: 700 22px/1.15 var(--font-titre); margin: 0; text-wrap: balance; }
.choix { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; }
.choix legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
.choix label { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.choix label:has(input:checked) { border-color: var(--or); box-shadow: inset 0 0 0 1px var(--or); }
.bilan { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.bilan th, .bilan td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.bilan th:first-child, .bilan td:first-child { text-align: left; }
.champ { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; width: 100%; }
.champ:focus-visible { outline: 3px solid var(--or); outline-offset: 1px; }
.ligne { display: flex; gap: 8px; align-items: center; }
.ligne .champ { flex: 1; }
.message { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }
.message.erreur { color: var(--ko); }
.code-salle { font: 700 30px/1 var(--font-titre); letter-spacing: 0.18em; text-align: center; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; user-select: all; }
.equipes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.equipes > div { display: grid; gap: 6px; align-content: start; }
.equipes b { font-size: 13px; color: var(--muted); }
.place { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: left; min-height: 38px; overflow-wrap: anywhere; }
.place.moi { border-color: var(--or); box-shadow: inset 0 0 0 1px var(--or); font-weight: 600; }
.place.libre { color: var(--muted); font-weight: 400; }
.btn[aria-pressed="true"] { background: var(--or); color: var(--or-fg); border-color: var(--or); }
.siege-visio { display: contents; }
.siege-corps { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.s2 .siege-corps, .s0 .siege-corps { flex-direction: row; flex-wrap: wrap; justify-content: center; }
.s0 { flex-wrap: wrap; }
.tuile { --tw: 92px; position: relative; flex: none; width: var(--tw); aspect-ratio: 4 / 3; border-radius: 12px; background: #0000005c; border: 2px solid #ffffff3d; overflow: hidden; display: grid; place-items: center; color: #fff; transition: box-shadow 0.1s; }
.tuile.parle { border-color: var(--or); box-shadow: 0 0 0 3px var(--or); }
.tuile .boutons { position: absolute; right: 4px; top: 4px; display: flex; gap: 4px; z-index: 2; }
.tuile .bouton-media { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1px solid #ffffff66; background: #000a; color: #fff; display: grid; place-items: center; cursor: pointer; }
.tuile .bouton-media[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.tuile .bouton-media:focus-visible { outline: 3px solid var(--or); outline-offset: 1px; }
.tuile .boutons, .tuile .son { transition: opacity 0.15s; }
.tuile.masquer .boutons, .tuile.masquer .son { opacity: 0; pointer-events: none; }
.tuile.masquer:hover .boutons, .tuile.masquer:hover .son, .tuile.masquer:focus-within .boutons,
.tuile.masquer.montre .boutons, .tuile.masquer.montre .son { opacity: 1; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { .tuile .boutons, .tuile .son { transition: none; } }
.tuile .bouton-media svg { width: 15px; height: 15px; fill: currentColor; }
@media (max-width: 560px) { .tuile { --tw: 56px; } .s2 .tuile, .s0 .tuile { --tw: 74px; } .tuile .bouton-media { width: 22px; height: 22px; } .tuile .bouton-media svg { width: 12px; height: 12px; } }
.tuile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tuile video.miroir { transform: scaleX(-1); }
.tuile img.relais { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tuile .visage { width: 50%; color: #fff; opacity: 0.4; }
.tuile .etiquette { display: none; position: absolute; left: 4px; bottom: 4px; max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #000b; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
.tuile .son { position: absolute; left: 6px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px #0007; }
.actions-media { display: flex; flex-wrap: wrap; gap: 8px; }
.pile { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.pile .tas { position: relative; display: inline-block; width: 30px; height: 40px; }
.pile .tas i { position: absolute; width: 26px; height: 36px; border-radius: 4px; border: 2px solid var(--carte);
  background: repeating-linear-gradient(45deg, var(--feutre-2) 0 4px, #2d7a5c 4px 8px); box-shadow: 0 1px 2px #0006; }
.pile b { font: 700 13px/1 var(--font-titre); background: #0000006a; border-radius: 999px; padding: 3px 7px; }
.carte-vol { position: fixed; z-index: 30; margin: 0; pointer-events: none; transition: transform 0.55s cubic-bezier(0.5, 0, 0.75, 0.4), opacity 0.55s; will-change: transform; }
@media (prefers-reduced-motion: reduce) { .carte-vol { transition: none; } }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.ko { color: var(--ko); }
.rouge { color: var(--rouge); }
.fiche .rouge { color: var(--rouge); }
</style>

</head>
<body>
<div id="app">
  <header class="barre">
    <h1>Belote</h1>
    <div class="scores" id="scores" aria-live="polite"></div>
    <div class="actions-tete"><button class="btn" id="btn-nouvelle" type="button">Nouvelle partie</button><button class="btn" id="btn-reglages" type="button">Réglages</button><button class="btn danger" id="btn-quitter" type="button" hidden>Quitter la partie</button></div>
  </header>
  <div class="jeu">
    <section class="table" id="table" aria-label="Table de jeu">
      <div class="accueil" id="accueil" hidden></div>
      <div class="contrat" id="contrat" aria-live="polite"></div>
      <div class="siege s2" id="siege-2"><div class="siege-visio"></div><div class="siege-corps"></div></div>
      <div class="siege s1" id="siege-1"><div class="siege-visio"></div><div class="siege-corps"></div></div>
      <div class="siege s3" id="siege-3"><div class="siege-visio"></div><div class="siege-corps"></div></div>
      <div class="centre">
        <div class="info" id="info" aria-live="polite"></div>
        <div class="pli" id="pli"></div>
        <div class="action" id="action" aria-live="polite"></div>
      </div>
      <div class="siege s0" id="siege-0"><div class="siege-visio"></div><div class="siege-corps"></div></div>
      <div class="main" id="main" aria-label="Votre main"></div>
    </section>
    <aside class="cote">
      <section class="panneau" id="visio" hidden>
        <h2 id="t-visio-titre">Voix et vidéo</h2>
        <p class="message" id="t-visio-aide">Votre vignette est à côté de votre nom, sur la table : le micro et la caméra s'y activent.</p>
        <button class="btn or" type="button" id="btn-son" hidden>Activer le son des autres joueurs</button>
        <p class="message" id="msg-media" aria-live="polite"></p>
      </section>
      <section class="panneau">
        <h2 id="t-journal">Journal</h2>
        <ul class="journal" id="journal"></ul>
      </section>
      <section class="panneau">
        <details>
          <summary id="t-regles">Rappel des règles</summary>
          <div id="t-regles-corps" class="regles"></div>
        </details>
      </section>
    </aside>
  </div>
</div>

<div class="voile" id="voile" hidden><div class="fiche" id="fiche"></div></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ===================== Moteur (port de belote.py) ===================== */
const COULEURS = ["Coeur", "Carreau", "Trefle", "Pique"];
const SYM = { Coeur: "♥", Carreau: "♦", Trefle: "♣", Pique: "♠" };
const NOM_COULEUR = { Coeur: "cœur", Carreau: "carreau", Trefle: "trèfle", Pique: "pique" };
const VALEURS = ["7", "8", "9", "10", "Valet", "Dame", "Roi", "As"];
const ABREGE = { "7": "7", "8": "8", "9": "9", "10": "10", Valet: "V", Dame: "D", Roi: "R", As: "A" };
const PT_ATOUT = { "7": 0, "8": 0, "9": 14, "10": 10, Valet: 20, Dame: 3, Roi: 4, As: 11 };
const PT_PLAIN = { "7": 0, "8": 0, "9": 0, "10": 10, Valet: 2, Dame: 3, Roi: 4, As: 11 };
const ORD_ATOUT = ["7", "8", "Dame", "Roi", "10", "As", "9", "Valet"];
const ORD_PLAIN = ["7", "8", "9", "Valet", "Dame", "Roi", "10", "As"];
const NOMS = ["Vous", "Ouest", "Partenaire", "Est"];
const ENCHERES = [80, 90, 100, 110, 120, 130, 140, 150, 160, 250];
const CAPOT = 250, TOTAL = 162, DIX_DE_DER = 10, BONUS_BELOTE = 20, BONUS_CAPOT = 90;

const k = (c) => c.v + "|" + c.c;
const has = (arr, c) => arr.some((x) => x.v === c.v && x.c === c.c);
const pts = (c, atout) => (c.c === atout ? PT_ATOUT : PT_PLAIN)[c.v];
const force = (c, atout, dem) => (c.c === atout ? 100 + ORD_ATOUT.indexOf(c.v) : c.c === dem ? ORD_PLAIN.indexOf(c.v) : -1);

function cmpCle(a, b) { for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; } return 0; }
function minBy(arr, f) { let best = arr[0], bk = f(best); for (const x of arr.slice(1)) { const kx = f(x); if (cmpCle(kx, bk) < 0) { best = x; bk = kx; } } return best; }
function maxBy(arr, f) { let best = arr[0], bk = f(best); for (const x of arr.slice(1)) { const kx = f(x); if (cmpCle(kx, bk) > 0) { best = x; bk = kx; } } return best; }

/* Les joueurs tournent dans le sens anti-horaire : Vous (0) → Est (3) → Partenaire (2) → Ouest (1). */
const apres = (depart, n) => (depart + 3 * n) % 4;
function creerJeu() { const j = []; for (const c of COULEURS) for (const v of VALEURS) j.push({ v, c }); return j; }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function gagnantPli(pli, atout) {
  const dem = pli[0].carte.c;
  let best = pli[0];
  for (const x of pli.slice(1)) if (force(x.carte, atout, dem) > force(best.carte, atout, dem)) best = x;
  return best.j;
}

function cartesJouables(main, pli, atout) {
  if (!pli.length) return main.slice();
  const dem = pli[0].carte.c;
  const meilleure = Math.max(...pli.map((x) => force(x.carte, atout, dem)));
  const meme = main.filter((c) => c.c === dem);
  if (meme.length) {
    if (dem === atout) {
      const hautes = meme.filter((c) => force(c, atout, dem) > meilleure);
      return hautes.length ? hautes : meme;
    }
    return meme;
  }
  const joueur = apres(pli[0].j, pli.length);
  if (gagnantPli(pli, atout) === (joueur + 2) % 4) return main.slice();
  const atouts = main.filter((c) => c.c === atout);
  if (atouts.length) {
    const forts = atouts.filter((c) => force(c, atout, dem) > meilleure);
    return forts.length ? forts : atouts;
  }
  return main.slice();
}

/* Main : ♥ ♣ ♦ ♠ de gauche à droite, valeurs décroissantes ; l'atout, une fois choisi, suit l'ordre des atouts. */
const ORDRE_MAIN = ["Coeur", "Trefle", "Carreau", "Pique"];
function trierMain(main, atout) {
  const rang = (c) => (c.c === atout ? ORD_ATOUT : ORD_PLAIN).indexOf(c.v);
  return main.slice().sort((a, b) => cmpCle([ORDRE_MAIN.indexOf(a.c), -rang(a)], [ORDRE_MAIN.indexOf(b.c), -rang(b)]));
}

/* ---- Bots ---- */
class Bot {
  debutDonne(moi, atout, preneur) { this.moi = moi; this.atout = atout; this.preneur = preneur; }
  valeurMain(main, couleur) {
    const cs = main.filter((c) => c.c === couleur);
    let t = cs.reduce((s, c) => s + PT_ATOUT[c.v], 0);
    if (cs.length >= 3) t += 10;
    t += 5 * main.filter((c) => c.v === "As" && c.c !== couleur).length;
    return t;
  }
  prise(main, retournee, tour) {
    let candidats, seuil, m = main;
    if (tour === 1) { candidats = [retournee.c]; m = main.concat([retournee]); seuil = 38; }
    else { candidats = COULEURS.filter((c) => c !== retournee.c); seuil = 34; }
    const meilleur = maxBy(candidats, (c) => [this.valeurMain(m, c)]);
    return this.valeurMain(m, meilleur) >= seuil ? meilleur : null;
  }
  estimation(main, couleur) { return Math.min(160, Math.floor((40 + this.valeurMain(main, couleur)) / 10) * 10); }
  enchere(main, courant, p) {
    if (courant && courant.j % 2 === p % 2) return null;
    const minimum = courant === null ? 80 : ENCHERES.find((v) => v > courant.valeur);
    if (minimum === undefined || minimum === CAPOT) return null;
    const couleur = maxBy(COULEURS, (c) => [this.estimation(main, c)]);
    return this.estimation(main, couleur) >= minimum ? { valeur: minimum, couleur } : null;
  }
  coinche(main, contrat) {
    const atouts = main.filter((c) => c.c === contrat.couleur).map((c) => c.v);
    const as_ = main.filter((c) => c.v === "As" && c.c !== contrat.couleur).length;
    if (contrat.valeur < 90) return false;
    return (atouts.includes("Valet") && atouts.includes("9")) || (atouts.includes("Valet") && as_ >= 1 && atouts.length >= 2);
  }
  surcoinche(main, contrat) { return this.estimation(main, contrat.couleur) >= contrat.valeur + 20; }
  choisirCarte(main, jouables, pli, atout) {
    if (jouables.length === 1) return jouables[0];
    const dem = pli.length ? pli[0].carte.c : null;
    if (!pli.length) {
      const v = jouables.find((c) => c.v === "Valet" && c.c === atout);
      if (v) return v;
      const as_ = jouables.filter((c) => c.v === "As" && c.c !== atout);
      if (as_.length) return as_[0];
      return minBy(jouables, (c) => [pts(c, atout), force(c, atout, c.c)]);
    }
    const courant = gagnantPli(pli, atout);
    const joueur = apres(pli[0].j, pli.length);
    if (courant === (joueur + 2) % 4) return maxBy(jouables, (c) => [pts(c, atout)]);
    const meilleure = Math.max(...pli.map((x) => force(x.carte, atout, dem)));
    const gagnantes = jouables.filter((c) => force(c, atout, dem) > meilleure);
    if (gagnantes.length) return minBy(gagnantes, (c) => [force(c, atout, dem)]);
    return minBy(jouables, (c) => [pts(c, atout), force(c, atout, c.c)]);
  }
}

class BotMalin extends Bot {
  valeurMain(main, couleur) {
    let t = super.valeurMain(main, couleur);
    const at = main.filter((c) => c.c === couleur).map((c) => c.v);
    if (at.includes("Valet") && at.includes("9")) t += 10;
    if (at.includes("Roi") && at.includes("Dame")) t += 10;
    if (at.length >= 5) t += 10;
    return t;
  }
  enchere(main, courant, p) {
    if (courant && courant.j % 2 === p % 2) return this.soutien(main, courant);
    return super.enchere(main, courant, p);
  }
  soutien(main, courant) {
    const at = main.filter((c) => c.c === courant.couleur).map((c) => c.v);
    const suivant = ENCHERES.find((v) => v > courant.valeur);
    if (suivant === undefined || suivant > 120) return null;
    const aces = main.filter((c) => c.v === "As" && c.c !== courant.couleur).length;
    const f = at.reduce((s, v) => s + PT_ATOUT[v], 0);
    if (at.length >= 2 && (at.includes("Valet") || at.includes("9")) && f + 5 * aces >= 30) return { valeur: suivant, couleur: courant.couleur };
    return null;
  }
  estMaitre(carte, atout, connues, main) {
    const ordre = carte.c === atout ? ORD_ATOUT : ORD_PLAIN;
    return ordre.slice(ordre.indexOf(carte.v) + 1).every((v) => connues.has(v + "|" + carte.c) || has(main, { v, c: carte.c }));
  }
  choisirCarte(main, jouables, pli, atout, vus) {
    if (jouables.length === 1) return jouables[0];
    const connues = new Set(vus.map((x) => k(x.carte)).concat(pli.map((x) => k(x.carte))));
    const dehors = ORD_ATOUT.map((v) => ({ v, c: atout })).filter((c) => !connues.has(k(c)) && !has(main, c));
    const moi = pli.length ? apres(pli[0].j, pli.length) : this.moi;
    const attaquant = this.preneur % 2 === moi % 2;
    if (!pli.length) return this.entame(main, jouables, atout, connues, dehors, attaquant);
    const dem = pli[0].carte.c;
    const courant = gagnantPli(pli, atout);
    const meilleure = Math.max(...pli.map((x) => force(x.carte, atout, dem)));
    const dernier = pli.length === 3;
    if (courant === (moi + 2) % 4) {
      const cp = pli.find((x) => x.j === courant).carte;
      const sur = dernier || (this.estMaitre(cp, atout, connues, main) && (cp.c === atout || dehors.length === 0));
      if (sur) return maxBy(jouables, (c) => [pts(c, atout), -force(c, atout, c.c)]);
      return minBy(jouables, (c) => [pts(c, atout), force(c, atout, c.c)]);
    }
    const gagnantes = jouables.filter((c) => force(c, atout, dem) > meilleure);
    if (gagnantes.length) {
      const enjeu = pli.reduce((s, x) => s + pts(x.carte, atout), 0);
      const coupe = gagnantes[0].c === atout && dem !== atout;
      if (!coupe || dernier || enjeu >= 10) return minBy(gagnantes, (c) => [force(c, atout, dem)]);
    }
    return minBy(jouables, (c) => [pts(c, atout), force(c, atout, c.c)]);
  }
  entame(main, jouables, atout, connues, dehors, attaquant) {
    if (attaquant && dehors.length) {
      const maitres = jouables.filter((c) => c.c === atout && this.estMaitre(c, atout, connues, main));
      if (maitres.length) return maxBy(maitres, (c) => [force(c, atout, atout)]);
    }
    const maitres = jouables.filter((c) => c.c !== atout && this.estMaitre(c, atout, connues, main));
    if (maitres.length) return maxBy(maitres, (c) => [pts(c, atout)]);
    const pool = jouables.filter((c) => c.c !== atout);
    return minBy(pool.length ? pool : jouables, (c) => [pts(c, atout), force(c, atout, c.c)]);
  }
}

const APPELS = ["10", "Roi", "Dame"], REFUS = ["7", "8"];

/* Bot expert : simule des donnes plausibles, lit les appels du partenaire et en envoie.
   N'utilise que des informations publiques (sa main, les cartes jouées, les enchères). */
class BotExpert extends BotMalin {
  constructor() { super(); this.ECHANTILLONS = 14; this.MARGE = 1.5; this.simple = new Bot(); }

  decouperPlis(vus, pli) {
    const plis = [];
    for (let i = 0; i < vus.length; i += 4) plis.push(vus.slice(i, i + 4));
    if (pli.length) plis.push(pli.slice());
    return plis;
  }
  signaux(vus, pli, atout) {
    const s = [0, 1, 2, 3].map(() => ({ appel: new Set(), refus: new Set() }));
    for (const t of this.decouperPlis(vus, pli)) {
      const dem = t[0].carte.c;
      for (const { j, carte } of t.slice(1)) {
        if (carte.c === dem || carte.c === atout) continue;
        if (APPELS.includes(carte.v)) { s[j].appel.add(carte.c); s[j].refus.delete(carte.c); }
        else if (REFUS.includes(carte.v)) { s[j].refus.add(carte.c); s[j].appel.delete(carte.c); }
      }
    }
    return s;
  }
  couleursVides(vus, pli, atout) {
    const vides = [0, 1, 2, 3].map(() => new Set());
    for (const t of this.decouperPlis(vus, pli)) {
      const dem = t[0].carte.c;
      t.forEach((x, i) => {
        if (i === 0 || x.carte.c === dem) return;
        vides[x.j].add(dem);
        if (x.carte.c !== atout && gagnantPli(t.slice(0, i), atout) !== (x.j + 2) % 4) vides[x.j].add(atout);
      });
    }
    return vides;
  }
  repartir(inconnues, besoins, vides) {
    const joueurs = [0, 1, 2, 3].filter((j) => besoins[j] !== null);
    const nbVides = (c) => joueurs.filter((j) => vides[j].has(c.c)).length;
    for (let essai = 0; essai < 25; essai++) {
      const cartes = melanger(inconnues).sort((a, b) => nbVides(b) - nbVides(a));
      const mains = [[], [], [], []], reste = besoins.slice();
      let ok = true;
      for (const c of cartes) {
        const eligibles = joueurs.filter((j) => reste[j] > 0 && !vides[j].has(c.c));
        if (!eligibles.length) { ok = false; break; }
        const j = eligibles[Math.floor(Math.random() * eligibles.length)];
        mains[j].push(c); reste[j]--;
      }
      if (ok) return mains;
    }
    const cartes = melanger(inconnues), mains = [[], [], [], []];
    let i = 0;
    for (const j of joueurs) { mains[j] = cartes.slice(i, i + besoins[j]); i += besoins[j]; }
    return mains;
  }
  poidsEchantillon(mains, signaux, partenaire) {
    let w = 1;
    const m = mains[partenaire];
    for (const couleur of signaux[partenaire].appel) if (m.some((c) => c.c === couleur && ["As", "10", "Roi"].includes(c.v))) w *= 3;
    for (const couleur of signaux[partenaire].refus) if (m.some((c) => c.c === couleur && c.v === "As")) w *= 0.3;
    return w;
  }
  retirer(main, carte) { const i = main.findIndex((c) => k(c) === k(carte)); main.splice(i, 1); }
  jouerFin(mains, pli, atout, equipe) {
    let gain = 0;
    pli = pli.slice();
    while (true) {
      while (pli.length < 4) {
        const j = apres(pli[0].j, pli.length);
        const jouables = cartesJouables(mains[j], pli, atout);
        const carte = jouables.length === 1 ? jouables[0] : this.simple.choisirCarte(mains[j], jouables, pli, atout);
        this.retirer(mains[j], carte);
        pli.push({ j, carte });
      }
      const gagnant = gagnantPli(pli, atout);
      const fini = mains.every((m) => m.length === 0);
      const g = pli.reduce((s, x) => s + pts(x.carte, atout), 0) + (fini ? DIX_DE_DER : 0);
      if (gagnant % 2 === equipe) gain += g;
      if (fini) return gain;
      const jouables = mains[gagnant].slice();
      const carte = jouables.length === 1 ? jouables[0] : this.simple.choisirCarte(mains[gagnant], jouables, [], atout);
      this.retirer(mains[gagnant], carte);
      pli = [{ j: gagnant, carte }];
    }
  }
  evaluer(main, jouables, pli, atout, vus, moi, signaux) {
    const joues = new Set(vus.map((x) => k(x.carte)).concat(pli.map((x) => k(x.carte))));
    const inconnues = creerJeu().filter((c) => !joues.has(k(c)) && !has(main, c));
    const deja = [0, 0, 0, 0];
    for (const x of vus.concat(pli)) deja[x.j]++;
    const besoins = [0, 1, 2, 3].map((j) => (j === moi ? null : 8 - deja[j]));
    if (besoins.reduce((s, n) => s + (n || 0), 0) !== inconnues.length) return null;
    const vides = this.couleursVides(vus, pli, atout);
    const partenaire = (moi + 2) % 4;
    const totaux = new Map(jouables.map((c) => [k(c), 0]));
    let somme = 0;
    for (let e = 0; e < this.ECHANTILLONS; e++) {
      const mains = this.repartir(inconnues, besoins, vides);
      const w = this.poidsEchantillon(mains, signaux, partenaire);
      somme += w;
      for (const c of jouables) {
        const simul = mains.map((m) => m.slice());
        simul[moi] = main.filter((x) => k(x) !== k(c));
        totaux.set(k(c), totaux.get(k(c)) + w * this.jouerFin(simul, pli.concat([{ j: moi, carte: c }]), atout, moi % 2));
      }
    }
    for (const [cle, t] of totaux) totaux.set(cle, t / somme);
    return totaux;
  }
  choisirCarte(main, jouables, pli, atout, vus) {
    if (jouables.length === 1) return jouables[0];
    const connues = new Set(vus.map((x) => k(x.carte)).concat(pli.map((x) => k(x.carte))));
    const dehors = ORD_ATOUT.map((v) => ({ v, c: atout })).filter((c) => !connues.has(k(c)) && !has(main, c));
    const moi = pli.length ? apres(pli[0].j, pli.length) : this.moi;
    const attaquant = this.preneur % 2 === moi % 2;
    const signaux = this.signaux(vus, pli, atout);
    const heuristique = pli.length
      ? this.suivre(main, jouables, pli, atout, connues, dehors, moi)
      : this.entameExperte(main, jouables, atout, connues, dehors, attaquant, moi, signaux);
    const scores = this.evaluer(main, jouables, pli, atout, vus, moi, signaux);
    if (!scores) return heuristique;
    const meilleur = Math.max(...scores.values());
    if (scores.get(k(heuristique)) >= meilleur - this.MARGE) return heuristique;
    return maxBy(jouables, (c) => [scores.get(k(c)), -pts(c, atout)]);
  }
  entameExperte(main, jouables, atout, connues, dehors, attaquant, moi, signaux) {
    if (attaquant && dehors.length) {
      const maitres = jouables.filter((c) => c.c === atout && this.estMaitre(c, atout, connues, main));
      if (maitres.length) return maxBy(maitres, (c) => [force(c, atout, atout)]);
    }
    const maitres = jouables.filter((c) => c.c !== atout && this.estMaitre(c, atout, connues, main));
    if (maitres.length) return maxBy(maitres, (c) => [pts(c, atout)]);
    const partenaire = (moi + 2) % 4;
    for (const couleur of [...signaux[partenaire].appel].sort()) {
      const cartes = jouables.filter((c) => c.c === couleur && couleur !== atout);
      if (cartes.length) return minBy(cartes, (c) => [force(c, atout, c.c)]);
    }
    const refus = signaux[partenaire].refus;
    const adverses = new Set([...signaux[(moi + 1) % 4].appel, ...signaux[(moi + 3) % 4].appel]);
    const pool = jouables.filter((c) => c.c !== atout);
    const base = pool.length ? pool : jouables;
    const preferees = base.filter((c) => !refus.has(c.c) && !adverses.has(c.c));
    return minBy(preferees.length ? preferees : base, (c) => [pts(c, atout), force(c, atout, c.c)]);
  }
  suivre(main, jouables, pli, atout, connues, dehors, moi) {
    const dem = pli[0].carte.c;
    const courant = gagnantPli(pli, atout);
    const meilleure = Math.max(...pli.map((x) => force(x.carte, atout, dem)));
    const dernier = pli.length === 3;
    const enjeu = pli.reduce((s, x) => s + pts(x.carte, atout), 0);
    if (courant === (moi + 2) % 4) {
      const cp = pli.find((x) => x.j === courant).carte;
      const sur = dernier || (this.estMaitre(cp, atout, connues, main) && (cp.c === atout || dehors.length === 0));
      if (sur) return maxBy(jouables, (c) => [pts(c, atout), -force(c, atout, c.c)]);
      return this.defausse(main, jouables, atout, dem, true);
    }
    const gagnantes = jouables.filter((c) => force(c, atout, dem) > meilleure);
    if (gagnantes.length) {
      const coupe = gagnantes[0].c === atout && dem !== atout;
      if (!coupe || dernier || enjeu >= 10) return minBy(gagnantes, (c) => [force(c, atout, dem)]);
    }
    return this.defausse(main, jouables, atout, dem, false);
  }
  /* Carte à donner quand on ne veut ou ne peut pas gagner le pli : c'est ici qu'on fait un appel. */
  defausse(main, jouables, atout, dem, partenaireGagne) {
    const hors = jouables.filter((c) => c.c !== dem && c.c !== atout);
    if (!hors.length || jouables.some((c) => c.c === dem)) return minBy(jouables, (c) => [pts(c, atout), force(c, atout, c.c)]);
    const masAs = new Set(main.filter((c) => c.v === "As" && c.c !== atout).map((c) => c.c));
    if (partenaireGagne) {
      const appels = hors.filter((c) => masAs.has(c.c) && APPELS.includes(c.v));
      if (appels.length) return maxBy(appels, (c) => [pts(c, atout)]);
    }
    const poids = {};
    for (const couleur of COULEURS) poids[couleur] = main.filter((c) => c.c === couleur).reduce((s, c) => s + pts(c, atout), 0);
    const pool = hors.filter((c) => !masAs.has(c.c));
    return minBy(pool.length ? pool : hors, (c) => [pts(c, atout), poids[c.c], force(c, atout, c.c)]);
  }
}

function resultat(preneur, cartes, plis, beloteEquipe, atout, contrat, mult) {
  const eq = preneur % 2;
  const totaux = cartes.slice();
  if (beloteEquipe !== null) totaux[beloteEquipe] += BONUS_BELOTE;
  let rempli, marque;
  if (contrat === null) {
    for (const e of [0, 1]) if (plis[e] === 8) totaux[e] += BONUS_CAPOT;
    rempli = totaux[eq] > totaux[1 - eq];
    marque = totaux.slice();
    if (!rempli) {
      marque = [0, 0];
      marque[1 - eq] = TOTAL;
      if (beloteEquipe !== null) marque[beloteEquipe] += BONUS_BELOTE;
    }
  } else {
    rempli = contrat === CAPOT ? plis[eq] === 8 : totaux[eq] >= contrat;
    marque = [0, 0];
    if (rempli) {
      if (mult === 1) { marque[eq] = cartes[eq] + contrat; marque[1 - eq] = cartes[1 - eq]; }
      else marque[eq] = (TOTAL + contrat) * mult;
    } else marque[1 - eq] = (TOTAL + contrat) * mult;
    if (beloteEquipe !== null) marque[beloteEquipe] += BONUS_BELOTE;
  }
  return { preneur, atout, contrat, mult, cartes, plis, belote: beloteEquipe, totaux, marque, rempli };
}

const $ = (s) => document.querySelector(s);

/* Perspective : S.moi est la place de ce navigateur ; sieges[q] vaut "local", "distant" (autre humain) ou "bot". */
const rel = (q) => (q - S.moi + 4) % 4;
const nom = (q) => S.noms[q] || t("sieges")[rel(q)];
const N = (q) => `§${q}§`; // marqueur de nom : résolu à l'affichage, chacun voit les noms de son point de vue
const fmt = (s) => String(s).replace(/§(\d)§/g, (_, q) => nom(Number(q)));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const propre = (s) => (String(s || "").replace(/[<>&"'`§]/g, "").trim().slice(0, 16) || "Joueur");
const ANNULE = { annule: true };

const LANGUES_UI = ["fr", "en", "es", "ja"];
const langue = () => (I18N[S.langue] ? S.langue : "fr");
/* t("clé", ...args) : texte de l'interface dans la langue choisie. */
function t(k, ...a) {
  let v = I18N[langue()][k];
  if (v === undefined) v = I18N.fr[k];
  return typeof v === "function" ? v(...a) : v;
}
const cn = (c) => I18N[langue()].couleurs[c];       // nom d'une couleur
const vn = (v) => I18N[langue()].valeurs[v];        // nom d'une valeur
const abr = (v) => I18N[langue()].abrege[v];        // abréviation sur les cartes
const nomContrat = (v) => (v === CAPOT ? t("capot") : String(v));
/* Message structuré : { k, a }. Les arguments {q} (siège), {c} (couleur), {s} (symbole), {v} (valeur de contrat)
   sont résolus à l'affichage, chacun voit donc le texte dans sa langue et avec ses propres noms. */
const msg = (k, ...a) => ({ k, a });
function txtMsg(m) {
  if (typeof m === "string") return fmt(m);
  const a = (m.a || []).map((x) => {
    if (x && typeof x === "object") {
      if ("q" in x) return nom(x.q);
      if ("c" in x) return cn(x.c);
      if ("s" in x) return SYM[x.s];
      if ("v" in x) return nomContrat(x.v);
      if ("k" in x) return t(x.k);
    }
    return x;
  });
  return t(m.k, ...a);
}
/* Le texte d'une bulle (au-dessus d'un joueur) : { k, a } avec symboles colorés. */
function bulleHtml(b) {
  if (!b) return "";
  if (typeof b === "string") return b;
  if (b.k === "b_prend") return t("b_prend", symHtml(b.a[0]));
  if (b.k === "enchere") return `${nomContrat(b.a[0])} ${symHtml(b.a[1])}`;
  return t(b.k);
}
function appliquerVoix() { S.voix = S.voixActive ? langue() : "off"; }
function langueNavigateur() {
  try { const l = String(navigator.language || "fr").slice(0, 2).toLowerCase(); return LANGUES_UI.includes(l) ? l : "fr"; } catch (e) { return "fr"; }
}
/* Textes écrits dans la page : mis à jour à chaque changement de langue. */
function traduireStatique() {
  const fixe = (id, txt) => { const el = document.querySelector(id); if (el) el.textContent = txt; };
  if (document.documentElement) document.documentElement.lang = langue();
  fixe("#btn-nouvelle", t("nouvelle_partie")); fixe("#btn-reglages", t("reglages")); fixe("#btn-quitter", t("quitter_partie"));
  fixe("#t-visio-titre", t("visio_titre")); fixe("#t-visio-aide", t("visio_aide")); fixe("#btn-son", t("btn_son"));
  fixe("#t-journal", t("journal")); fixe("#t-regles", t("regles"));
  const regles = document.querySelector("#t-regles-corps"); if (regles) regles.innerHTML = t("regles_html");
  const table = document.querySelector("#table"); if (table) table.setAttribute("aria-label", t("table_aria"));
  const main = document.querySelector("#main"); if (main) main.setAttribute("aria-label", t("main_aria"));
}
/* Change de langue : interface, annonces vocales et textes déjà affichés suivent. */
function appliquerLangue() {
  appliquerVoix();
  traduireStatique();
  if (S.accueilActif) construireAccueil();
  render(); renderJournal(); majBoutonQuitter(); majBoutonsMedia(); majVisio();
}

function carteHtml(c, extra) {
  const rouge = c.c === "Coeur" || c.c === "Carreau";
  return `<span class="carte ${rouge ? "rouge" : ""} ${extra || ""}"><span class="coin"><b>${abr(c.v)}</b><i>${SYM[c.c]}</i></span><span class="gros">${SYM[c.c]}</span></span>`;
}
const symHtml = (couleur) => `<span class="${couleur === "Coeur" || couleur === "Carreau" ? "rouge" : ""}">${SYM[couleur]}</span>`;

function log(k, ...a) { S.journal.unshift(typeof k === "string" && a.length === 0 && !I18N.fr[k] ? k : msg(k, ...a)); if (S.journal.length > 10) S.journal.pop(); renderJournal(); }

function render() {
  if (S.auto) return;
  const eq = S.moi % 2;
  $("#scores").innerHTML = `<span>${t("nous")}</span> <b>${S.scores[eq]}</b> <span>${t("eux")}</span> <b>${S.scores[1 - eq]}</b> <span>${t("objectif", S.cible)}</span>`;
  for (let q = 0; q < 4; q++) {
    const plaque = `<span class="plaque ${S.tour === q ? "actif" : ""}">${esc(nom(q))}${S.donneur === q ? `<span class="donneur">${t("donneur")}</span>` : ""}</span>`;
    const bulle = `<div class="bulle">${bulleHtml(S.bulles[q])}</div>`;
    const n = S.plisGagnes[q] || 0;
    const tas = n ? `<span class="pile" title="${t("pile_titre", n)}" aria-label="${t("pile_aria", n)}"><span class="tas">${
      Array.from({ length: Math.min(n, 5) }, (_, i) => `<i style="left:${i * 2}px;top:${(4 - i) * 2}px"></i>`).join("")}</span><b>${n}</b></span>` : "";
    const corps = q === S.moi ? plaque + tas + bulle
      : `${plaque}${S.mains[q].length ? `<span class="carte dos"><span class="nb">${S.mains[q].length}</span></span>` : ""}${tas}${bulle}`;
    $("#siege-" + rel(q) + " .siege-corps").innerHTML = corps;
  }
  // contrat (en haut à gauche de la table)
  let lignes = [];
  if (S.mode === "coinche" && S.enchereCourante && S.atout === null) {
    const e = S.enchereCourante;
    lignes = [`<div class="titre">${t("c_enchere")}</div>`, `<div>${nomContrat(e.valeur)} ${symHtml(e.couleur)}</div>`, `<div>${esc(t("c_par", nom(e.j)))}</div>`];
  } else if (S.atout) {
    lignes = [`<div class="titre">${t("c_atout", symHtml(S.atout))}</div>`];
    if (S.contrat) lignes.push(`<div>${t("c_contrat", nomContrat(S.contrat))}</div>`);
    lignes.push(`<div>${esc(t("c_preneur", nom(S.preneur)))}</div>`);
    if (S.mult > 1) lignes.push(`<div class="note">${S.mult === 2 ? t("c_coinche") : t("c_surcoinche")}</div>`);
  } else if (S.retournee) {
    lignes = [`<div class="titre">${t("c_retournee")}</div>`, `<div>${carteHtml(S.retournee, "mini")}</div>`];
  }
  $("#contrat").innerHTML = lignes.join("");
  const avis = S.avis && Date.now() < S.avis.jusqua ? txtMsg(S.avis) : null;
  const toast = S.toast ? (typeof S.toast === "string" ? fmt(S.toast) : t("toast", nom(S.toast.a[0].q), t(S.toast.k))) : "";
  $("#info").textContent = avis || toast;
  $("#info").className = "info" + (avis ? " avis" : "");
  majBoutonQuitter();
  let pli = "";
  for (const x of S.pli) pli += `<div class="p${rel(x.j)} ${S.gagnant === x.j ? "gagnant" : ""}">${carteHtml(x.carte)}</div>`;
  if (!S.pli.length && S.retournee && S.atout === null) pli = `<div class="p0" style="grid-area:2/2">${carteHtml(S.retournee)}</div>`;
  // un pli vient d'être ramassé : les cartes vont rejoindre le tas du joueur qui l'a gagné
  const anciennes = [...document.querySelectorAll("#pli > div")];
  const collecte = anciennes.length === 4 && S.pli.length === 0 && RENDU.gagnant !== null
    ? { cartes: anciennes.map((d) => ({ el: d.firstElementChild || d, r: d.getBoundingClientRect() })), gagnant: RENDU.gagnant } : null;
  $("#pli").innerHTML = pli;
  if (S.pli.length === 4 && S.gagnant !== null) RENDU.gagnant = S.gagnant;
  if (S.pli.length === 0) RENDU.gagnant = null;
  if (collecte) animerCollecte(collecte.cartes, collecte.gagnant);
  // main
  const main = trierMain(S.mains[S.moi], S.atout);
  const att = S.attenteCarte;
  if (R.role === "hote") diffuserEtat();
  majVisio();
  $("#main").innerHTML = main.map((c) => {
    const rouge = c.c === "Coeur" || c.c === "Carreau";
    const jouable = att && has(att.jouables, c);
    const cls = `carte ${rouge ? "rouge" : ""} ${att ? (jouable ? "jouable" : "grise") : ""}`;
    const label = t("carte_aria", vn(c.v), cn(c.c));
    return `<button type="button" class="${cls}" data-k="${k(c)}" aria-label="${label}" ${jouable ? "" : "disabled"}><span class="coin"><b>${abr(c.v)}</b><i>${SYM[c.c]}</i></span><span class="gros">${SYM[c.c]}</span></button>`;
  }).join("");
}
const RENDU = { gagnant: null };
/* Fait voler les 4 cartes du pli vers le tas du gagnant (clones fixes, supprimés à l'arrivée). */
function animerCollecte(cartes, gagnant) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cible = document.querySelector(`#siege-${rel(gagnant)} .pile`) || document.querySelector(`#siege-${rel(gagnant)}`);
  if (!cible) return;
  const rc = cible.getBoundingClientRect();
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
  const clones = cartes.map(({ el, r }, i) => {
    const c = el.cloneNode(true);
    c.classList.add("carte-vol");
    Object.assign(c.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", transitionDelay: i * 40 + "ms" });
    document.body.appendChild(c);
    return { c, dx: cx - (r.left + r.width / 2), dy: cy - (r.top + r.height / 2) };
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    clones.forEach(({ c, dx, dy }) => { c.style.transform = `translate(${dx}px, ${dy}px) scale(0.35)`; c.style.opacity = "0.2"; });
  }));
  setTimeout(() => clones.forEach(({ c }) => c.remove()), 900);
}

/* ---- Voix des joueurs (synthèse vocale du navigateur) ---- */
const LANGUES = { fr: "fr-FR", en: "en-US", es: "es-ES", ja: "ja-JP" };
const COULEUR_VOIX = {
  fr: { Coeur: "cœur", Carreau: "carreau", Trefle: "trèfle", Pique: "pique" },

  ja: { Coeur: "ハート", Carreau: "ダイヤ", Trefle: "クラブ", Pique: "スペード" },
};
const NOMS_VOIX = {
  fr: ["vous", "Ouest", "votre partenaire", "Est"],
  en: ["you", "West", "your partner", "East"],
  es: ["usted", "Oeste", "su compañero", "Este"],
  ja: ["あなた", "西", "パートナー", "東"],
};
const hasard = (liste) => liste[Math.floor(Math.random() * liste.length)];
/* Plusieurs tournures par annonce pour que les joueurs ne répètent pas toujours la même phrase. */
const PHRASES = {
  fr: {
    passe: () => hasard(["Je passe.", "Pas pour moi.", "Passe.", "Je laisse."]),
    prend: (c) => hasard([`Je prends à ${c} !`, `Je prends à ${c}.`, `Pour moi, ${c} !`]),
    enchere: (v, c) => (v === CAPOT ? hasard([`Capot à ${c} !`, `Je tente le capot à ${c} !`]) : hasard([`${v} ${c} !`, `Je dis ${v} ${c}.`, `${v} à ${c}.`])),
    coinche: () => hasard(["Coinche !", "Je coinche !"]),
    surcoinche: () => hasard(["Surcoinche !", "Je surcoinche !"]),
    belote: () => "Belote !", rebelote: () => "Rebelote !",
    contrat: (c, p, v, mult) => {
      const nom = NOMS_VOIX.fr[rel(p)];
      if (v === null) return `Atout ${c}, pris par ${nom}.`;
      const suite = mult === 4 ? ", surcoinché" : mult === 2 ? ", coinché" : "";
      return v === CAPOT ? `Contrat : capot à ${c}, par ${nom}${suite}.` : `Contrat : ${v} à ${c}, par ${nom}${suite}.`;
    },
  },
  en: {
    passe: () => hasard(["Pass.", "I pass.", "Not for me.", "Pass for me."]),
    prend: (c) => hasard([`I take ${c}!`, `I'll take ${c}.`, `${c} for me!`]),
    enchere: (v, c) => (v === CAPOT ? hasard([`Capot in ${c}!`, `I'm going for capot, ${c}!`]) : hasard([`${v} ${c}!`, `I say ${v} ${c}.`, `${v} in ${c}.`])),
    coinche: () => hasard(["Coinche!", "I coinche!"]),
    surcoinche: () => hasard(["Surcoinche!", "I surcoinche!"]),
    belote: () => "Belote!", rebelote: () => "Rebelote!",
    contrat: (c, p, v, mult) => {
      const nom = NOMS_VOIX.en[rel(p)];
      if (v === null) return `Trump is ${c}, taken by ${nom}.`;
      const suite = mult === 4 ? ", surcoinched" : mult === 2 ? ", coinched" : "";
      return v === CAPOT ? `Contract: capot in ${c}, by ${nom}${suite}.` : `Contract: ${v} in ${c}, by ${nom}${suite}.`;
    },
  },
  es: {
    passe: () => hasard(["Paso.", "Yo paso.", "Nada para mí.", "Paso, gracias."]),
    prend: (c) => hasard([`¡Tomo ${c}!`, `Me quedo con ${c}.`, `¡Yo cojo ${c}!`]),
    enchere: (v, c) => (v === CAPOT ? hasard([`¡Capot en ${c}!`, `¡Voy a por el capot, ${c}!`]) : hasard([`¡${v} ${c}!`, `Digo ${v} ${c}.`, `${v} en ${c}.`])),
    coinche: () => hasard(["¡Coinche!", "¡Yo coincho!"]),
    surcoinche: () => hasard(["¡Sobrecoinche!", "¡Yo sobrecoincho!"]),
    belote: () => "¡Belote!", rebelote: () => "¡Rebelote!",
    contrat: (c, p, v, mult) => {
      const nom = NOMS_VOIX.es[rel(p)];
      if (v === null) return `Triunfo ${c}, lo toma ${nom}.`;
      const suite = mult === 4 ? ", sobrecoinchado" : mult === 2 ? ", coinchado" : "";
      return v === CAPOT ? `Contrato: capot en ${c}, de ${nom}${suite}.` : `Contrato: ${v} en ${c}, de ${nom}${suite}.`;
    },
  },
  ja: {
    passe: () => hasard(["パス！", "パスです。", "見送ります。"]),
    prend: (c) => hasard([`${c}で取ります！`, `${c}でいきます！`, `${c}にします。`]),
    enchere: (v, c) => (v === CAPOT ? hasard([`${c}でカポ！`, `カポを狙います、${c}！`]) : hasard([`${v}、${c}！`, `${v}の${c}です。`])),
    coinche: () => hasard(["コアンシュ！", "コアンシュです！"]),
    surcoinche: () => hasard(["シュルコアンシュ！", "シュルコアンシュです！"]),
    belote: () => "ベロット！", rebelote: () => "リベロット！",
    contrat: (c, p, v, mult) => {
      const nom = NOMS_VOIX.ja[rel(p)];
      if (v === null) return `切り札は${c}、${nom}が取りました。`;
      const suite = mult === 4 ? "、シュルコアンシュ" : mult === 2 ? "、コアンシュ" : "";
      return v === CAPOT ? `契約は${c}でカポ、${nom}${suite}。` : `契約は${c}で${v}、${nom}${suite}。`;
    },
  },
};
const SILENCE_MS = 2000;

/* Classement des voix : naturelles d'abord, voix fantaisie (macOS) et robotiques en dernier. */
const VOIX_NATURELLES = /^(samantha|daniel|karen|moira|tessa|aaron|nicky|arthur|martha|gordon|catherine|thomas|am[ée]lie|marie|jacques|m[óo]nica|paulina|jorge|juan|diego|marisol|ang[ée]lica|kyoko|o-ren|hattori|otoya|alex|victoria|allison|ava|susan|google|microsoft|siri)/;
const VOIX_FANTAISIE = /^(albert|bahh|boing|bonnes nouvelles|good news|bouffon|jester|bulles|bubbles|cloches|bells|fred|junior|kathy|mauvaises nouvelles|bad news|murmure|whisper|orgue|organ|ralph|superstar|trino[iï]des?|violoncelles|cellos|wobble|zarvox|deranged|hysterical|princess)/;
const VOIX_ROBOTIQUES = /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|espeak)/;
function scoreVoix(v, lang) {
  const n = v.name.toLowerCase();
  let s = 0;
  if (VOIX_NATURELLES.test(n)) s += 6;
  if (/premium|enhanced|neural|natural|online|wavenet/.test(n)) s += 4;
  if (VOIX_FANTAISIE.test(n)) s -= 10;
  if (VOIX_ROBOTIQUES.test(n)) s -= 2;
  if (lang && v.lang.replace("_", "-").toLowerCase() === lang.toLowerCase()) s += 1;
  return s;
}
function voixPour(p, lang) {
  try {
    const prefixe = lang.slice(0, 2).toLowerCase();
    const voix = window.speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith(prefixe));
    if (!voix.length) return null;
    const classees = voix.slice().sort((a, b) => scoreVoix(b, lang) - scoreVoix(a, lang));
    const bonnes = classees.filter((v) => scoreVoix(v, lang) >= 0);
    const liste = bonnes.length ? bonnes : classees;
    return liste[p % liste.length];
  } catch (e) { return null; }
}
function dire(texte, p) {
  return new Promise((res) => {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return res(false);
    const lang = LANGUES[S.voix];
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = lang;
    u.pitch = [1.0, 0.9, 1.12, 1.02][p] + (Math.random() - 0.5) * 0.12;
    u.rate = 1.05 + (Math.random() - 0.5) * 0.12;
    const v = voixPour(p, lang);
    if (v) u.voice = v;
    let fini = false, t = null;
    const fin = () => { if (!fini) { fini = true; clearTimeout(t); res(true); } };
    t = setTimeout(fin, 10000);
    u.onend = fin; u.onerror = fin;
    try { window.speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}
function silence(ms) {
  const id = S.partieId;
  if (S.sansDelai) return Promise.resolve();
  return new Promise((res, rej) => setTimeout(() => (id === S.partieId ? res() : rej(ANNULE)), ms));
}
/* Voix reçue d'un autre navigateur (jeu en ligne) : on parle sans attendre. */
function parlerLocal(p, type, args) {
  if (S.voix === "off") return;
  const noms = COULEUR_VOIX[S.voix];
  dire(PHRASES[S.voix][type](...args.map((a) => (typeof a === "string" && noms[a] ? noms[a] : a))), p);
}
/* Fait parler le joueur p, puis laisse 2 secondes de silence. Renvoie false si la voix est coupée. */
async function annoncer(p, type, ...args) {
  if (R.role === "hote") diffuser({ t: "voix", p, type, args });
  if (S.auto || S.voix === "off") return false;
  const noms = COULEUR_VOIX[S.voix];
  const texte = PHRASES[S.voix][type](...args.map((a) => (typeof a === "string" && noms[a] ? noms[a] : a)));
  const ok = await dire(texte, p);
  if (ok) await silence(SILENCE_MS);
  return ok;
}
const reflechir = () => pause(S.voix === "off" || S.auto ? 800 : 300);

/* ---- Interactions humaines ---- */
function attendre(construire) {
  const id = S.partieId;
  return new Promise((res) => {
    const zone = $("#action");
    zone.innerHTML = "";
    construire(zone, (v) => { if (id !== S.partieId) return; zone.innerHTML = ""; res(v); });
  });
}
function bouton(txt, cls, fn, html) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "btn " + (cls || "");
  if (html) b.innerHTML = txt; else b.textContent = txt;
  b.addEventListener("click", fn);
  return b;
}
function question(zone, txt) { const q = document.createElement("div"); q.className = "question"; q.textContent = txt; zone.appendChild(q); }

function humainPrise(retournee, tour) {
  return attendre((zone, fin) => {
    if (tour === 1) {
      question(zone, t("prise1_q"));
      zone.appendChild(bouton(t("prise1_btn", symHtml(retournee.c)), "or", () => fin(retournee.c), true));
      zone.appendChild(bouton(t("passer"), "", () => fin(null)));
    } else {
      question(zone, t("prise2_q"));
      for (const c of COULEURS.filter((x) => x !== retournee.c)) zone.appendChild(bouton(`${symHtml(c)} ${cn(c)}`, "or", () => fin(c), true));
      zone.appendChild(bouton(t("passer"), "", () => fin(null)));
    }
  });
}
function humainEnchere(courant) {
  return attendre((zone, fin) => {
    question(zone, t("enchere_q"));
    let choisie = null;
    const vals = document.createElement("div"); vals.className = "valeurs";
    const suits = document.createElement("div"); suits.className = "valeurs";
    const chips = [];
    for (const v of ENCHERES) {
      const ch = document.createElement("button");
      ch.type = "button"; ch.className = "chip"; ch.textContent = nomContrat(v);
      ch.setAttribute("aria-pressed", "false");
      ch.disabled = !!courant && v <= courant.valeur;
      ch.addEventListener("click", () => {
        choisie = v;
        chips.forEach((x) => x.setAttribute("aria-pressed", String(x === ch)));
        suitBtns.forEach((b) => (b.disabled = false));
      });
      chips.push(ch); vals.appendChild(ch);
    }
    const suitBtns = COULEURS.map((c) => {
      const b = bouton(`${symHtml(c)} ${cn(c)}`, "or", () => fin({ valeur: choisie, couleur: c }), true);
      b.disabled = true; suits.appendChild(b); return b;
    });
    zone.appendChild(vals); zone.appendChild(suits);
    zone.appendChild(bouton(t("passer"), "", () => fin(null)));
  });
}

    question(zone, q);
    zone.appendChild(bouton(oui, "or", () => fin(true)));
    zone.appendChild(bouton(non, "", () => fin(false)));

}

/* ---- Déroulement d'une donne ---- */
const estHumain = (p) => S.sieges[p] !== "bot" && !S.auto;

/* Réponse d'un joueur humain de ce navigateur. */
function reponseLocale(kind, d) {
  if (S.pilote) return Promise.resolve(S.pilote[kind](d));
  switch (kind) {
    case "prise": return humainPrise(d.retournee, d.tour);
    case "enchere": return humainEnchere(d.courant);
    case "coinche": return humainOuiNon(t("coinche_q", nom(d.preneur), nomContrat(d.valeur), SYM[d.couleur]), t("coinche_btn"), t("laisser"));
    case "surcoinche": return humainOuiNon(t("surcoinche_q"), t("surcoinche_btn"), t("laisser"));
    case "carte": return humainCarte(d.jouables);
  }
}
/* Décision d'un bot : sert aussi quand un joueur en ligne quitte la partie. */
function reponseBot(p, kind, d) {
  const b = bots[p], main = S.mains[p];
  switch (kind) {
    case "prise": return b.prise(main, d.retournee, d.tour);
    case "enchere": return b.enchere(main, d.courant, p);
    case "coinche": return b.coinche(main, { valeur: d.valeur, couleur: d.couleur, j: d.preneur });
    case "surcoinche": return b.surcoinche(main, { valeur: d.valeur, couleur: d.couleur, j: d.preneur });
    case "carte": return b.choisirCarte(main, d.jouables, S.pli.slice(), S.atout, S.vus.slice());
  }
}
function valider(kind, d, v) {
  switch (kind) {
    case "prise": return v === null || (d.tour === 1 ? v === d.retournee.c : COULEURS.includes(v) && v !== d.retournee.c) ? v : null;
    case "enchere": return v && ENCHERES.includes(v.valeur) && COULEURS.includes(v.couleur) ? { valeur: v.valeur, couleur: v.couleur } : null;
    case "carte": return d.jouables.find((c) => v && k(c) === k(v)) || d.jouables[0];
    default: return !!v;
  }
}
/* Demande une décision au joueur p, qu'il soit ici, sur un autre navigateur ou remplacé par un bot. */
function demander(p, kind, d) {
  if (S.sieges[p] === "local") return reponseLocale(kind, d);
  if (S.sieges[p] === "bot") return Promise.resolve(reponseBot(p, kind, d));
  return new Promise((res) => {
    const id = ++R.idDemande;
    R.attentes.set(id, { p, kind, d, res });
    envoyer(p, { t: "demande", id, kind, data: d });
  });
}
let bots = [];

async function encheresBelote(mains, retournee, donneur) {
  for (const tour of [1, 2]) {
    if (tour === 2) S.bulles = {};
    for (let kk = 0; kk < 4; kk++) {
      const p = apres(donneur, 1 + kk);
      S.tour = p; render();
      let choix;
      if (estHumain(p)) choix = await demander(p, "prise", { retournee, tour });
      else { await reflechir(); choix = bots[p].prise(mains[p], retournee, tour); }
      if (choix) {
        S.bulles[p] = msg("b_prend", choix);
        log("log_prend", { q: p }, { s: choix }, { c: choix });
        S.tour = null; render();
        if (!(await annoncer(p, "prend", choix))) await pause(900);
        return { preneur: p, atout: choix };
      }
      S.bulles[p] = msg("b_passe"); log("log_passe", { q: p }); render();
      await annoncer(p, "passe");
    }
  }
  return null;
}

async function encheresCoinche(mains, donneur) {
  let courant = null, passes = 0, kk = 0;
  while (true) {
    const p = apres(donneur, 1 + kk); kk++;
    S.tour = p; render();
    let choix;
    if (estHumain(p)) choix = await demander(p, "enchere", { courant });
    else { await reflechir(); choix = bots[p].enchere(mains[p], courant, p); }
    let parole;
    if (choix && (courant === null || choix.valeur > courant.valeur) && ENCHERES.includes(choix.valeur)) {
      courant = { valeur: choix.valeur, couleur: choix.couleur, j: p };
      S.enchereCourante = courant; passes = 0;
      S.bulles[p] = msg("enchere", choix.valeur, choix.couleur);
      log("log_annonce", { q: p }, { v: choix.valeur }, { s: choix.couleur });
      parole = ["enchere", choix.valeur, choix.couleur];
    } else { passes++; S.bulles[p] = msg("b_passe"); log("log_passe", { q: p }); parole = ["passe"]; }
    render();
    await annoncer(p, ...parole);
    if (courant === null && passes === 4) return null;
    if (courant !== null && passes === 3) break;
  }
  S.tour = null;
  const preneur = courant.j;
  let mult = 1;
  for (const adv of [apres(preneur, 1), apres(preneur, 3)]) {
    S.tour = adv; render();
    let coinche;
    if (estHumain(adv)) coinche = await demander(adv, "coinche", { preneur, valeur: courant.valeur, couleur: courant.couleur });
    else { await reflechir(); coinche = bots[adv].coinche(mains[adv], courant); }
    if (coinche) {
      mult = 2; S.bulles[adv] = msg("b_coinche"); log("log_coinche", { q: adv }); render();
      await annoncer(adv, "coinche");
      let sur;
      S.tour = preneur; render();
      if (estHumain(preneur)) sur = await demander(preneur, "surcoinche", { preneur, valeur: courant.valeur, couleur: courant.couleur });
      else { await reflechir(); sur = bots[preneur].surcoinche(mains[preneur], courant); }
      if (sur) { mult = 4; S.bulles[preneur] = msg("b_surcoinche"); log("log_surcoinche", { q: preneur }); render(); await annoncer(preneur, "surcoinche"); }
      break;
    }
  }
  S.tour = null; render();
  return { preneur, atout: courant.couleur, valeur: courant.valeur, mult };
}

async function jouerDonne(donneur) {
  const jeu = melanger(creerJeu());
  S.plisGagnes = [0, 0, 0, 0];
  Object.assign(S, { pli: [], vus: [], atout: null, preneur: null, contrat: null, mult: 1, retournee: null, tour: null, gagnant: null, bulles: {}, enchereCourante: null, toast: null, donneur });
  let mains, preneur, atout, contrat = null, mult = 1;

  if (S.mode === "coinche") {
    mains = [0, 1, 2, 3].map((i) => jeu.slice(i * 8, i * 8 + 8));
    S.mains = mains; log("log_donne", { q: donneur }); render(); await pause(500);
    const r = await encheresCoinche(mains, donneur);
    if (!r) { log("log_nul_encherit"); S.bulles = {}; render(); await pause(1200); return null; }
    ({ preneur, atout, valeur: contrat, mult } = r);
  } else {
    mains = [0, 1, 2, 3].map((i) => jeu.slice(i * 5, i * 5 + 5));
    const retournee = jeu[20], reste = jeu.slice(21);
    S.mains = mains; S.retournee = retournee; log("log_donne", { q: donneur }); render(); await pause(500);
    const r = await encheresBelote(mains, retournee, donneur);
    if (!r) { log("log_nul_prend"); S.retournee = null; S.bulles = {}; render(); await pause(1200); return null; }
    ({ preneur, atout } = r);
    mains[preneur].push(retournee);
    let i = 0;
    for (let p = 0; p < 4; p++) { const n = p === preneur ? 2 : 3; mains[p].push(...reste.slice(i, i + n)); i += n; }
    S.retournee = null;
  }
  Object.assign(S, { atout, preneur, contrat, mult, bulles: {}, tour: null });
  render();
  if (!(await annoncer(donneur, "contrat", atout, preneur, contrat, mult))) await pause(300);
  bots.forEach((b, p) => b.debutDonne(p, atout, preneur));
  render(); await pause(600);

  const beloteJoueur = [0, 1, 2, 3].find((p) => has(mains[p], { v: "Roi", c: atout }) && has(mains[p], { v: "Dame", c: atout }));
  const beloteEquipe = beloteJoueur === undefined ? null : beloteJoueur % 2;
  let beloteJouees = 0;
  const cartes = [0, 0], plis = [0, 0];
  let meneur = apres(donneur, 1);

  for (let numero = 0; numero < 8; numero++) {
    S.pli = []; S.gagnant = null;
    for (let kk = 0; kk < 4; kk++) {
      const p = apres(meneur, kk);
      const jouables = cartesJouables(mains[p], S.pli, atout);
      S.tour = p; render();
      let carte;
      if (estHumain(p)) {
        carte = await demander(p, "carte", { jouables });
      } else {
        await pause(650);
        carte = bots[p].choisirCarte(mains[p], jouables, S.pli.slice(), atout, S.vus.slice());
      }
      mains[p].splice(mains[p].findIndex((c) => k(c) === k(carte)), 1);
      S.pli.push({ j: p, carte });
      if (p === beloteJoueur && ((carte.v === "Roi" || carte.v === "Dame") && carte.c === atout)) {
        beloteJouees++;
        const cle = beloteJouees === 1 ? "belote" : "rebelote";
        log("toast", { q: p }, { k: cle }); S.toast = { k: cle, a: [{ q: p }] }; setTimeout(() => { S.toast = null; render(); }, 1600);
        render();
        await annoncer(p, beloteJouees === 1 ? "belote" : "rebelote");
      }
      S.tour = null; render();
    }
    const gagnant = gagnantPli(S.pli, atout);
    const gain = S.pli.reduce((s, x) => s + pts(x.carte, atout), 0) + (numero === 7 ? DIX_DE_DER : 0);
    cartes[gagnant % 2] += gain; plis[gagnant % 2]++;
    S.gagnant = gagnant; render();
    log("log_pli", numero + 1, { q: gagnant }, gain);
    await pause(1300);
    S.vus.push(...S.pli);
    S.plisGagnes[gagnant]++;
    meneur = gagnant;
  }
  S.pli = []; S.gagnant = null; render();
  return resultat(preneur, cartes, plis, beloteEquipe, atout, contrat, mult);
}

/* ===================== Jeu en ligne (pair à pair, 2 à 4 joueurs) ===================== */
/* L'hôte fait tourner la partie ; les autres navigateurs reçoivent leur vue (leur main seulement)
   et renvoient leurs choix. Les places non occupées sont tenues par des bots. */
/* Les données de jeu passent par un courtier de messages public (MQTT sur WebSocket) : il suffit que
   chaque navigateur puisse sortir vers Internet, même en 4G ou derrière un pare-feu. La voix et la
   vidéo, elles, utilisent une connexion directe (WebRTC) et peuvent ne pas aboutir sur certains réseaux. */
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt", "wss://mqtt-dashboard.com:8884/mqtt"];
const PREFIXE = "belote-v1/";
const ICE_MEDIA = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };
const R = {
  role: "solo",          // "solo" | "hote" | "client"
  phase: null,           // "salle" | "jeu"
  connecter: (url, opts) => mqtt.connect(url, opts),   // remplaçable (tests)
  usinePeer: (id) => (id ? new Peer(id, { config: ICE_MEDIA }) : new Peer({ config: ICE_MEDIA })), // connexion directe : voix, vidéo et voie de secours du jeu
  T: { ping: 5000, perteClient: 20000, perteHote: 25000, presence: 600000, connexion: 15000 },
  mqtt: null, rubrique: null, monId: null, code: null, essai: 0, minuteries: [], dernierVu: 0,
  clients: new Map(),    // hôte : id du client -> { lien, vu }
  peerMedia: null,
  places: [null, null, null, null],   // hôte : { nom, lien, peerId } par siège ; lien null = l'hôte lui-même
  placesVues: [null, null, null, null], // client : { nom } par siège
  lienHote: null,                     // client : lien vers l'hôte
  attentes: new Map(), fiches: new Map(), idDemande: 0, idFiche: 0,
  nomsAbs: [null, null, null, null], message: null,
  absents: {},          // hôte : siège -> { nom, jeton } d'un joueur parti, qui peut revenir
  peersVus: [null, null, null, null],   // client : identifiants WebRTC des joueurs, par siège
};
const ORDRE_PLACES = [0, 2, 1, 3]; // le 2e joueur devient le partenaire de l'hôte

function envoyer(q, msg) { try { const l = R.places[q] && R.places[q].lien; if (l && l.open) l.send(msg); } catch (e) { /* lien fermé */ } }
function diffuser(msg) { for (let q = 0; q < 4; q++) envoyer(q, msg); }

function diffuserEtat() {
  if (R.phase !== "jeu") return;
  for (let q = 0; q < 4; q++) {
    if (S.sieges[q] !== "distant") continue;

      t: "etat", L: q, mode: S.mode, cible: S.cible, scores: S.scores, donneur: S.donneur, atout: S.atout,
      preneur: S.preneur, contrat: S.contrat, mult: S.mult, retournee: S.retournee, tour: S.tour, gagnant: S.gagnant,
      pli: S.pli, bulles: S.bulles, journal: S.journal, enchereCourante: S.enchereCourante, toast: S.toast,
      noms: R.nomsAbs.map((n, i) => (i === q ? null : n)),
      peers: R.places.map((p) => (p && p.peerId) || null),
      avis: S.avis && Date.now() < S.avis.jusqua ? { k: S.avis.k, a: S.avis.a } : null,
      plisGagnes: S.plisGagnes,
      mains: S.mains.map((m, i) => (i === q ? m : m.length)),
    });

}

function deplacer(de, q) {

  if (R.places[q].lien) R.places[q].lien._siege = q; else S.moi = q;
  diffuserSalle(); afficherSalle();
